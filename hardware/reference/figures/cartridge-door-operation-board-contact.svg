<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 690" role="img" aria-labelledby="title description">
<title id="title">Cartridge dust-door operation</title>
<desc id="description">Three illustrative side sections show the cartridge dust door closed, pushed inward by the cartridge board tongue during insertion, and alongside the cartridge when seated. Each slot has its own return-sprung door. This schematic is not to scale and does not establish forces, fit, or wear life.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42677a"/></marker>
 <style>
  text{font-family:Arial,sans-serif;fill:#183044;font-size:20px}.title{font-size:29px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:18px}.panel{fill:#fbfcfd;stroke:#aab8c0;stroke-width:2}.case{fill:#ddd8ca;stroke:#817d73;stroke-width:2}.flap{stroke:#42545e;stroke-width:12;stroke-linecap:round}.hinge{fill:#b9c2c6;stroke:#42545e;stroke-width:2}.body{fill:#333a3d;stroke:#161f23;stroke-width:2}.board{fill:#337657;stroke:#22523b;stroke-width:2}.socket{fill:#b5a794;stroke:#665d50;stroke-width:2}.movement{fill:none;stroke:#42677a;stroke-width:3;marker-end:url(#arrow)}.guide{fill:none;stroke:#6b7b83;stroke-width:2}.touch{fill:#ecb742;stroke:#8f6917;stroke-width:2}
 </style>
</defs>
<rect width="1500" height="690" fill="white"/>
<text x="45" y="48" class="title">Cartridge dust doors</text>
<text x="45" y="80" class="small">Operating principle — illustrative side sections, not to scale</text>

<!-- Closed: the individual leaf covers the opening. -->
<g transform="translate(35,120)">
 <rect width="455" height="435" rx="10" class="panel"/>
 <text x="25" y="40" class="head">1 · CLOSED</text>
 <text x="25" y="70" class="small">Return spring holds the leaf shut</text>
 <rect x="40" y="225" width="90" height="24" class="case"/>
 <rect x="290" y="225" width="90" height="24" class="case"/>
 <path d="M130 237H290" class="flap"/>
 <circle cx="130" cy="237" r="10" class="hinge"/>
 <path d="M85 310L125 246" class="guide"/>
 <text x="25" y="336" class="small">Hinge</text>
 <path d="M275 180L245 228" class="guide"/>
 <text x="270" y="170" class="small">Closed leaf</text>
</g>

<!-- Insertion: the protruding board reaches the angled leaf. -->
<g transform="translate(522,120)">
 <rect width="455" height="435" rx="10" class="panel"/>
 <text x="25" y="40" class="head">2 · INSERTING</text>
 <text x="25" y="70" class="small">The board tongue pushes the leaf inward</text>
 <rect x="40" y="225" width="90" height="24" class="case"/>
 <rect x="290" y="225" width="90" height="24" class="case"/>
 <rect x="165" y="105" width="80" height="94" rx="5" class="body"/>
 <rect x="199" y="195" width="12" height="126" class="board"/>
 <path d="M130 237L243 350" class="flap"/>
 <circle cx="130" cy="237" r="10" class="hinge"/>
 <circle cx="205" cy="312" r="7" class="touch"/>
 <path d="M265 128V196" class="movement"/>
 <path d="M280 325L220 314" class="guide"/>
 <text x="283" y="330" class="small">Contact</text>
 <path d="M85 338L155 270" class="guide"/>
 <text x="25" y="365" class="small">Leaf turns inward</text>
</g>

<!-- Seated: the leaf is alongside the card; the connector is schematic. -->
<g transform="translate(1009,120)">
 <rect width="455" height="435" rx="10" class="panel"/>
 <text x="25" y="40" class="head">3 · SEATED</text>
 <text x="25" y="70" class="small">The leaf stays beside the cartridge</text>
 <rect x="40" y="225" width="90" height="24" class="case"/>
 <rect x="290" y="225" width="90" height="24" class="case"/>
 <rect x="147" y="359" width="58" height="36" rx="3" class="socket"/>
 <rect x="136" y="105" width="80" height="210" rx="5" class="body"/>
 <rect x="170" y="310" width="12" height="76" class="board"/>
 <path d="M130 237V397" class="flap"/>
 <circle cx="130" cy="237" r="10" class="hinge"/>
 <path d="M270 137H216" class="guide"/>
 <text x="275" y="143" class="small">Cartridge body</text>
 <path d="M270 343H182" class="guide"/>
 <text x="275" y="339" class="small">Board tongue</text>
 <path d="M80 360H122" class="guide"/>
 <text x="25" y="354" class="small">Leaf</text>
</g>

<text x="45" y="605" class="small">Each slot opens independently. When its cartridge is withdrawn, the spring returns that leaf to its closed stop.</text>
<text x="45" y="634" class="small">The current nominal model contacts the board tongue; insertion force, wear, and production fit remain unqualified.</text>
</svg>
