<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390 870" role="img" aria-labelledby="title desc">
<title id="title">BMSX physical interconnect groups</title>
<desc id="desc">Four custom devices share a multiplexed 32-bit system bus. CORE controls main DRAM and a separate 16-bit cartridge path. GFX controls video SRAM and RGB/control output and sends display extent to U7. APU controls sample SRAM and serial audio. The I/O bridge connects firmware flash, keyboard and game pads.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#294b68"/></marker>
 <style>text{font-family:Arial,sans-serif;fill:#183044;font-size:19px}.box{fill:#f5f7f8;stroke:#294b68;stroke-width:2}.chip{fill:#e1edf4;stroke:#294b68;stroke-width:2.5}.bus{fill:none;stroke:#294b68;stroke-width:5}.link{fill:none;stroke:#294b68;stroke-width:2.5;marker-end:url(#arrow);marker-start:url(#arrow)}.title{font-size:24px;font-weight:bold}.minor{font-size:17px}.label{font-size:18px}</style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="270" y="35" width="290" height="115" rx="8" class="box"/>
<text x="415" y="70" text-anchor="middle" class="title">Main DRAM</text><text x="415" y="99" text-anchor="middle">U10 + U11 · 4 MiB</text><text x="415" y="126" text-anchor="middle" class="minor">Two 1M ×16 devices</text>
<rect x="660" y="35" width="290" height="115" rx="8" class="box"/>
<text x="805" y="70" text-anchor="middle" class="title">Video SRAM</text><text x="805" y="99" text-anchor="middle">U30 + U31 · 2 MiB</text><text x="805" y="126" text-anchor="middle" class="minor">Two 512K ×16 devices</text>
<rect x="1050" y="35" width="290" height="115" rx="8" class="box"/>
<text x="1195" y="70" text-anchor="middle" class="title">Sample SRAM</text><text x="1195" y="99" text-anchor="middle">U32 · 512 KiB</text><text x="1195" y="126" text-anchor="middle" class="minor">One 256K ×16 device</text>
<path d="M415,150 V220" class="link"/><text x="435" y="177" class="minor">MD[31:0]</text><text x="435" y="201" class="minor">MA[9:0] + controls</text>
<path d="M805,150 V220" class="link"/><text x="825" y="177" class="minor">VRAM_D[31:0]</text><text x="825" y="201" class="minor">A[18:0] + controls</text>
<path d="M1195,150 V220" class="link"/><text x="1215" y="177" class="minor">ARAM_D[15:0]</text><text x="1215" y="201" class="minor">A[17:0] + controls</text>
<rect x="270" y="220" width="290" height="215" rx="8" class="chip"/>
<text x="415" y="257" text-anchor="middle" class="title">U1 CORE · system ASIC</text><text x="415" y="291" text-anchor="middle">CPU execution core</text><text x="415" y="320" text-anchor="middle" class="minor">+ separate arithmetic / DMA engines</text><text x="415" y="355" text-anchor="middle" class="minor">DRAM / cartridge / system control</text><text x="415" y="392" text-anchor="middle" class="minor">See U1 internal organisation</text>
<rect x="660" y="220" width="290" height="215" rx="8" class="chip"/>
<text x="805" y="257" text-anchor="middle" class="title">U2 GFX</text><text x="805" y="291" text-anchor="middle">GPU · PCRTC</text><text x="805" y="333" text-anchor="middle" class="minor">Local memory arbitration</text><text x="805" y="363" text-anchor="middle" class="minor">RGB[23:0] / blank / sync</text><text x="805" y="392" text-anchor="middle" class="minor">→ U35 video DAC</text>
<rect x="1050" y="220" width="290" height="215" rx="8" class="chip"/>
<text x="1195" y="257" text-anchor="middle" class="title">U4 APU</text><text x="1195" y="291" text-anchor="middle">Sound and sample storage</text><text x="1195" y="333" text-anchor="middle" class="minor">Shared-bus request / grant</text><text x="1195" y="363" text-anchor="middle" class="minor">Serial audio / master clock</text><text x="1195" y="392" text-anchor="middle" class="minor">→ U34 audio DAC</text>
<rect x="20" y="255" width="190" height="145" rx="8" class="box"/>
<text x="115" y="290" text-anchor="middle" class="title">Two sockets</text><text x="115" y="323" text-anchor="middle" class="minor">U51 transceiver</text><text x="115" y="351" text-anchor="middle" class="minor">CAD[15:0]</text><text x="115" y="377" text-anchor="middle" class="minor">Latch / ready / control</text><path d="M210,330 H270" class="link"/>
<path d="M415,435 V520 M805,435 V520 M1195,435 V520 M415,520 H1195 M415,520 V610" class="bus"/>
<circle cx="415" cy="520" r="6" fill="#294b68"/><circle cx="805" cy="520" r="6" fill="#294b68"/>
<text x="820" y="560" text-anchor="middle" class="title">SYS_AD[31:0] + strobes / byte enables / ready</text><text x="820" y="587" text-anchor="middle" class="minor">Metadata → address → turnaround → data → response → release</text>
<path d="M660,415 H610 V480 H425 C425,468 405,468 405,480 H240 V630 H270" fill="none" stroke="#294b68" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="595" y="494" transform="rotate(-90 595 494)" class="minor">DISPLAY_CONTEXT</text>
<text x="960" y="618" text-anchor="middle" class="minor">U2.174 → U7.62 · logical width / height / epoch</text>
<rect x="270" y="610" width="290" height="160" rx="8" class="chip"/>
<text x="415" y="650" text-anchor="middle" class="title">U7 I/O / ROM bridge</text><text x="415" y="689" text-anchor="middle">Firmware-flash access</text><text x="415" y="720" text-anchor="middle">Keyboard and game pads</text>
<rect x="660" y="640" width="290" height="130" rx="8" class="box"/>
<text x="805" y="675" text-anchor="middle" class="title">Firmware flash</text><text x="805" y="707" text-anchor="middle">U33 · 8 MiB fitted</text><text x="805" y="738" text-anchor="middle" class="minor">ROM_D[15:0], A[21:0]</text><path d="M560,685 H660" class="link"/>
<rect x="1050" y="640" width="290" height="130" rx="8" class="box"/>
<text x="1195" y="675" text-anchor="middle" class="title">Front interfaces</text><text x="1195" y="707" text-anchor="middle">Four game-pad ports</text><text x="1195" y="738" text-anchor="middle" class="minor">Keyboard clock / data</text><path d="M415,770 V820 H1195 V770" class="link"/>
</svg>
