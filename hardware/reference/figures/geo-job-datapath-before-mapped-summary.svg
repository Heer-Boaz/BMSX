<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
<title id="title">GEO addressed geometry and collision jobs</title>
<desc id="desc">The CPU programs and launches a GEO job within CORE. The controller reads addressed records from system ROM, main RAM, or the selected cartridge bus. XFORM2 transforms Q16 vertices and can write bounds; SAT2 compares Q16 world vertices; OVERLAP2D consumes separate binary32 shape and translation data and generates contacts. Ordinary results go to main RAM. The job controller publishes status and progress and requests an interrupt on completion or fault. Software constructs drawing packets separately for GFX. The illustration is functional and does not prove physical timing or clipping capacity.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#294b68"/></marker>
 <style>text{font-family:Arial,sans-serif;fill:#183044;font-size:20px}.title{font-size:29px;font-weight:bold}.head{font-size:22px;font-weight:bold}.small{font-size:18px}.minor{font-size:17px}.device{fill:#f8fafb;stroke:#91a9b8;stroke-width:2}.unit{fill:#e1edf4;stroke:#294b68;stroke-width:2}.store{fill:#f3f6f8;stroke:#294b68;stroke-width:2}.engine{fill:#eaf4ec;stroke:#426b53;stroke-width:2}.line{fill:none;stroke:#294b68;stroke-width:2.5;marker-end:url(#arrow)}</style>
</defs>
