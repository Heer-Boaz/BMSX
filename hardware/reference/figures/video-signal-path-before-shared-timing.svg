<text x="500" y="358" text-anchor="middle" class="small">Address and pixel format</text>
<path d="M265 205 H330 V204 H400" class="path"/>
<path d="M265 265 H330 V338 H400" class="path"/>
<rect x="650" y="211" width="190" height="125" rx="8" class="chip"/>
