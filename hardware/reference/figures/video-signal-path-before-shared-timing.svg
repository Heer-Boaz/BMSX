<text x="1112" y="205" text-anchor="middle" class="small">ADV7125 · 13.5 MHz</text>
<path d="M840 244 H915 V185 H970" class="path"/>
<text x="906" y="228" text-anchor="middle" class="small">RGB / blank</text>
