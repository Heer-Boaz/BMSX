<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" role="img" aria-labelledby="title desc">
<title id="title">BMSX video source and output paths</title>
<desc id="desc">Video SRAM supplies the two PCRTC display circuits. GFX composes their pixels and sends RGB and blanking to the video DAC. Composite sync follows a separate buffer and filter to SCART. A fixed 13.5 MHz clock drives the DAC.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#294b68"/></marker>
 <style>text{font-family:Arial,sans-serif;fill:#183044;font-size:19px}.title{font-size:27px;font-weight:bold}.heading{font-size:21px;font-weight:bold}.small{font-size:17px}.chip{fill:#e1edf4;stroke:#294b68;stroke-width:2}.storage{fill:#f5f7f8;stroke:#294b68;stroke-width:2}.path{fill:none;stroke:#294b68;stroke-width:2.5;marker-end:url(#arrow)}.group{fill:#fbfcfd;stroke:#93a9b8;stroke-width:2}</style>
</defs>
