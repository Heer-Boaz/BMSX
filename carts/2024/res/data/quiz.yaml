question_heading: 'Vraag %d/%d: '
intro:
  - Beste Eli,
  - Welkom bĳ deze quiz,
  - Een speelse uitdaging,dat is wat dit is.
  - Met vragen over films,sport en spel,
  - Ben je klaar?
  - Dan beginnen we snel!
complete:
  - Gefeliciteerd! Je bent geniaal! Jouw diepgaande kennis is fenomenaal!
  - Dat je zou winnen,daarover twĳfelde ik niet,ondanks de moeilĳke vragen van mĳn quizmasterpiet!
