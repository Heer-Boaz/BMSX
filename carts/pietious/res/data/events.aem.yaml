events:
    # --- Music routing (no room-id checks) ---
    room.enter:
        channel: music
        rules: &room_music_rules
            - when:
                  equals:
                      daemon_fight_active: true
                      suppress_room_music: false
              go:
                  music_transition:
                      audio_id: music_daemonfight
            - when:
                  equals:
                      has_active_seal: true
                      suppress_room_music: false
              go:
                  music_transition:
                      audio_id: music_seal_2
                      sync:
                          stinger: music_seal_1
            - when:
                  equals:
                      world_number: 0
                      suppress_room_music: false
              go:
                  music_transition:
                      audio_id: music_castle
            - when:
                  equals:
                      suppress_room_music: false
              go:
                  music_transition:
                      audio_id: music_world

    shrine_exit_done:
        channel: music
        rules: *room_music_rules

    lithograph_exit_done:
        channel: music
        rules: *room_music_rules

    title:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 0

    intro:
        channel: sfx
        rules:
            - go:
                  audio_id: prelude

    intro_done:
        channel: sfx
        rules:
            - go:
                  stop:
                      fade_ms: 0

    story:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_story
                      start_fresh: true

    story_finish:
        channel: music
        on_finished: story_done
        rules:
            - go:
                  stop:
                      fade_ms: 2480

    shrine:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_shrine_2
                      sync:
                          stinger: music_shrine_1

    lithograph:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_lithograph2
                      sync:
                          stinger: music_lithograph1

    epilogue:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_epilogue
                      sync:
                          stinger: music_epiloguestart

    epilogue_finish:
        channel: music
        on_finished: epilogue_done
        rules:
            - go:
                  stop:
                      fade_ms: 2480

    end_demo:
        channel: sfx
        on_finished: end_demo_done
        rules:
            - go:
                  audio_id: enddemo

    victory_dance:
        channel: sfx
        policy: queue
        on_finished: victory_dance_done
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: pickupkey
                      - audio_id: danceofjoy

    # The director owns the summon phase boundaries. Audio clips do not advance
    # gameplay; each phase starts its cue immediately at the matching event.
    seal_dissolution:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: seal_breakdown
                      sync: immediate
                      start_fresh: true

    daemon_appearance:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_daemonappears
                      sync: immediate
                      start_fresh: true

    daemon_appearance_done:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_daemonfight
                      sync: immediate
                      start_fresh: true

    daemon.health_half:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_daemonfight_2
                      sync: immediate
                      start_fresh: true

    daemon.health_quarter:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_daemonfight_3
                      sync: immediate
                      start_fresh: true

    daemon.defeated:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: daemondeath

    daemon.death_complete:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_keyonfloor
                      sync: immediate
                      start_fresh: true

    daemon.spawn_burst:
        channel: sfx
        rules:
            - go:
                  audio_id: daemon_spawn2

    daemon.landed:
        channel: sfx
        rules:
            - go:
                  audio_id: daemonlandonfloor

    daemon.minion_appeared:
        channel: sfx
        rules:
            - go:
                  audio_id: appearance

    # --- SFX routing ---
    jump:
        channel: sfx
        rules:
            - go:
                  audio_id: jump

    fall:
        channel: sfx
        rules:
            - go:
                  audio_id: fall

    water_transition:
        channel: sfx
        rules:
            - go:
                  audio_id: watersplash

    hit:
        channel: sfx
        rules:
            - go:
                  audio_id: hit

    approachingdeath:
        channel: sfx
        rules:
            - go:
                  audio_id: approachingdeath

    dying:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: dying

    enter_world_start:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: enterleave

    enter_shrine_start:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: enterleave

    player.shrine_overlay_exit:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 0

    leave_shrine_overlay:
        channel: sfx
        rules:
            - go:
                  audio_id: enterleave

    world_emerge_start:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: enterleave

    world_emerge_done:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_castle

    worlddooropen:
        channel: sfx
        rules:
            - go:
                  audio_id: worlddooropen

    sword_start:
        channel: sfx
        rules:
            - go:
                  audio_id: slice

    fire_pepernoot:
        channel: sfx
        rules:
            - go:
                  audio_id: pepernoot

    item.picked:
        channel: sfx
        rules:
            - when:
                  in:
                      item_type: [life, lifefromrock]
              go:
                  audio_id: healing
            - go:
                  audio_id: pickupitem

    f1:
        channel: sfx
        rules:
            - go:
                  audio_id: f1

    pause_entered:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - pause_music: {}
                      - audio_id: f2

    pause_exited:
        channel: music
        rules:
            - go:
                  resume_music: {}

    select:
        channel: sfx
        rules:
            - go:
                  audio_id: select

    title_start:
        channel: sfx
        rules:
            - go:
                  audio_id: gamestart

    d.bw.s:
        channel: sfx
        rules:
            - go:
                  audio_id: gamestart

    halo_resolved_from_world:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_castle
                      fade_ms: 2480

    world_leave_transition_start:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 2480

    damage.resolved:
        channel: sfx
        rules:
            - when:
                  equals:
                      status: applied
                      target_kind: world1_daemon
                      destroyed: false
              go:
                  audio_id: daemondamage
            - when:
                  and:
                      - equals:
                            status: applied
                            destroyed: true
                      - not:
                            in:
                                target_kind:
                                    - breakablewall
                                    - disappearingwall
                                    - world1_daemon
              go:
                  audio_id: foeexplosion
            - when:
                  equals:
                      status: applied
                      destroyed: false
              go:
                  audio_id: foedamage

    paperspawn:
        channel: sfx
        rules:
            - go:
                  audio_id: paperspawn

    muzieknootspawn:
        channel: sfx
        rules:
            - go:
                  audio_id: muzieknootspawn

    cross:
        channel: sfx
        rules:
            - go:
                  audio_id: cross

    crossland:
        channel: sfx
        rules:
            - go:
                  audio_id: crossland

    rotatedoor:
        channel: sfx
        rules:
            - go:
                  audio_id: rotatedoor

    appearance:
        channel: sfx
        rules:
            - go:
                  audio_id: appearance

    d.bp.c:
        channel: sfx
        rules:
            - go:
                  audio_id: appearance

    staffspawn:
        channel: sfx
        rules:
            - go:
                  audio_id: daemonfire
