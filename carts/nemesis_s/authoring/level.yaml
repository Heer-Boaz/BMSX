sections:
- from: 0
  to: 128
  title: Ruimteaanloop
  intention: De oorspronkelijke formaties en escorte blijven volledig behouden.
- from: 128
  to: 196
  title: De stadspoort
  intention: De eerste kade en een bewaakte boogbrug leiden naar de stad.
- from: 196
  to: 289
  title: De winkelstraat
  intention: Winkels, lijstgevels en steegpoorten demonstreren de stadsset; kleine plantenbakken en terrastafels vullen de
    vrije plekken.
- from: 289
  to: 385
  title: De havenweg
  intention: Een dunne asfaltkant voert langs het kleine tankstation en de drie geparkeerde cabines. Een lage besneeuwde bermrand
    draagt een rustig plantsoen met winterbomen, haag en bank; de zijcamera blijft vast.
- from: 385
  to: 443
  title: De oude kade
  intention: De woonkade krijgt een kleine zitplek tussen de bestelbus en de hoge gevel, waarna de daken met geschut volgen.
- from: 443
  to: 510
  title: De hijswerf
  intention: Onder de hijsinstallatie ligt een werf met kelderdeuren, twee zijtrappen, café en binnenplaats.
- from: 510
  to: 625
  title: De binnenhaven
  intention: De brede vaargeul eindigt bij een hoge winkelkade met kelderfront, trap naar de lage werf en zitplekken.
- from: 625
  to: 689
  title: De sluispakhuizen
  intention: De pakhuizen worden afgewisseld met een café, lijstgevel en kelderwerf met een trap langs de muur.
- from: 689
  to: 801
  title: De buitenhaven
  intention: Een tweede afgemeerde stoomboot blijft achter terwijl het schip over ruim havenwater naar de laatste brug vliegt.
- from: 801
  to: 848
  title: De IJsmolen
  intention: Het molengevecht houdt de buitenpier dicht; daarna verlaat het schip de stad.
- from: 848
  to: 912
  title: Uitvlucht
  intention: De lange uitvlucht blijft vrij sterrenveld met escorte.
- from: 912
  to: 931
  title: De maan
  intention: De maan neemt het lege scherm over.
