events:
    story:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_story
                      start_fresh: true

    story_done:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 0

    end_demo:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_end_demo
                      start_fresh: true

    title_start:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_game_start
                      start_fresh: true

    game_start:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 0

    game_over:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 0

    pause_entered:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - pause_music: {}
                      - audio_id: nemesis2_pause

    pause_exited:
        channel: music
        rules:
            - go:
                  resume_music: {}

    stage.music.intro:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_stage_intro
                      fade_ms: 4000
                      start_fresh: true

    stage.music.main:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_stage
                      fade_ms: 4000
                      start_fresh: true

    stage.music.boss:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_boss
                      fade_ms: 4000
                      sync:
                          stinger: music_boss_intro

    stage.music.restart.intro:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_stage_intro
                      start_fresh: true

    stage.music.restart.main:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_stage
                      start_fresh: true

    stage.music.restart.boss:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_boss
                      start_fresh: true

    player.death:
        channel: sfx
        rules:
            - go:
                  audio_id: player_death

    player.bullet_fired:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_kogeltje

    player.laser_fired:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_laser

    enemy.spawned:
        channel: sfx
        rules:
            - go:
                  audio_id: parodius_enemy_spawn

    enemy.ray_fired:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_foe_laser

    enemy.bel.ring:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_something_fell

    enemy.bel.armored_hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_structure_hit
                  priority: 8

    enemy.bel.hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_boss_hit

    enemy.bel.destroyed:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_core_explosion

    enemy.moon.small_ray_fired:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_foe_laser_3

    enemy.moon.death_ray_fired:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_foe_uber_laser

    enemy.moon.armored_hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_structure_hit
                  priority: 8

    enemy.moon.hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_boss_hit

    enemy.moon.defeated:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_core_explosion

    enemy.moon.explosion:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: nemesis2_boss_explosion

    enemy.small.destroyed:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_foe_death

    enemy.zak.destroyed:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_torendood

    enemy.structure.hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_structure_hit

    enemy.structure.destroyed:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_structure_explosion

    pickup.powerup:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_roodje

    pickup.option:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis3_option_take

    player.powerup_activated:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_powerup_taken
