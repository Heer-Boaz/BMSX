events:
    intro:
        channel: sfx
        rules:
            - go:
                  audio_id: prelude

    intro_done:
        channel: sfx
        rules:
            - go:
                  stop:
                      fade_ms: 0

    story:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_story
                      start_fresh: true

    story_done:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 0

    end_demo:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_end_demo
                      start_fresh: true

    title_start:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_game_start
                      start_fresh: true

    game_start:
        channel: music
        rules:
            - go:
                  stop:
                      fade_ms: 0

    stage.music.intro:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_stage_intro
                      fade_ms: 4000
                      start_fresh: true

    stage.music.main:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_stage
                      fade_ms: 4000
                      start_fresh: true

    stage.music.boss:
        channel: music
        rules:
            - go:
                  music_transition:
                      audio_id: music_boss
                      fade_ms: 4000
                      sync:
                          stinger: music_boss_intro

    player.death:
        channel: sfx
        rules:
            - go:
                  audio_id: player_death

    enemy.bel.ring:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_something_fell

    enemy.bel.armored_hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_structure_hit
                  priority: 8

    enemy.bel.hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_boss_hit

    enemy.bel.destroyed:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_core_explosion

    enemy.moon.small_ray_fired:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_foe_laser_3

    enemy.moon.death_ray_fired:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_foe_uber_laser

    enemy.moon.armored_hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_structure_hit
                  priority: 8

    enemy.moon.hit:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_boss_hit

    enemy.moon.defeated:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_core_explosion

    enemy.moon.explosion:
        channel: sfx
        rules:
            - go:
                  sequence:
                      - stop:
                            channel: music
                            fade_ms: 0
                      - audio_id: nemesis2_boss_explosion

    enemy.small.destroyed:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_foe_death

    pickup.powerup:
        channel: sfx
        rules:
            - go:
                  audio_id: nemesis2_roodje
