<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 520" role="img" aria-labelledby="title desc">
<title id="title">Proposed guest and private native program stores</title>
<desc id="desc">CORE sends guest or native fetches over shared SYS to U7. U7 drives shared flash address and data lines and separate chip selects for the existing guest BIOS flash and a proposed native firmware flash. This is an unimplemented board revision.</desc>
<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#294b68"/></marker><style>text{font-family:Arial,sans-serif;fill:#183044;font-size:19px}.title{font-size:27px;font-weight:bold}.head{font-size:22px;font-weight:bold}.small{font-size:16px}.unit{fill:#e5eff5;stroke:#294b68;stroke-width:2}.flash{fill:#f7f8f9;stroke:#294b68;stroke-width:2}.future{fill:#fff9e7;stroke:#9b6d21;stroke-width:2;stroke-dasharray:8 5}.wire{fill:none;stroke:#294b68;stroke-width:2.4;marker-end:url(#arr)}.both{fill:none;stroke:#294b68;stroke-width:2.4;marker-start:url(#arr);marker-end:url(#arr)}</style></defs>
<rect width="1250" height="520" fill="white"/>
<text x="42" y="49" class="title">CORE native program store — external flash candidate</text>
<text x="42" y="81" class="small">Functional board revision only: the second flash and native execution owner are not fitted.</text>
<rect x="42" y="164" width="235" height="152" rx="9" class="unit"/>
<text x="159" y="202" class="head" text-anchor="middle">U1 CORE</text>
<text x="159" y="236" text-anchor="middle">Guest program</text>
<text x="159" y="268" text-anchor="middle">Native interpreter</text>
<text x="159" y="294" class="small" text-anchor="middle">separate request origins</text>
<rect x="412" y="164" width="246" height="152" rx="9" class="unit"/>
<text x="535" y="202" class="head" text-anchor="middle">U7 ROM bridge</text>
<text x="535" y="236" text-anchor="middle">word-read sequencer</text>
<text x="535" y="268" text-anchor="middle">bank selection</text>
<text x="535" y="294" class="small" text-anchor="middle">one flash selected at a time</text>
<path d="M277 240H412" class="both"/><text x="344" y="219" text-anchor="middle" class="small">shared SYS</text>
<rect x="927" y="119" width="270" height="105" rx="9" class="flash"/>
<text x="1062" y="157" class="head" text-anchor="middle">U33 guest ROM</text>
<text x="1062" y="187" text-anchor="middle">BIOS image · zero tail</text>
<rect x="927" y="271" width="270" height="105" rx="9" class="future"/>
<text x="1062" y="309" class="head" text-anchor="middle">Private code ROM</text>
<text x="1062" y="339" text-anchor="middle">native interpreter</text>
<path d="M658 201H742V148H927" class="wire"/><text x="755" y="136" class="small">U7.120: guest CE_N</text>
<path d="M658 278H742V351H927" class="wire"/><text x="755" y="375" class="small">U7.119: private CE_N</text>
<path d="M658 240H829" class="both"/><path d="M829 240V200H927" class="both"/><path d="M829 240V295H927" class="both"/>
<text x="677" y="226" class="small">shared address / data</text>
<text x="42" y="432" class="small">Both flash output-enables low; write-enables inactive. RESET and programming follow the selected devices.</text>
<text x="42" y="462" class="small">Native-only access, boot, flash loading, timing and physical placement still require implementation and qualification.</text>
</svg>
