<path d="M735 364 H851 V388 H735" class="wire"/>
<path d="M846 349 H1360 V403 H846 Q832 403 832 389 V363 Q832 349 846 349 Z" class="jacket"/>
<path d="M735 376 H1015" class="wire"/>
<path d="M912 326 H968 V349 H912 Z M912 403 H968 V426 H912 Z" class="clamp"/>
<!-- The stop represents a possible retention method, not production geometry. -->
<path d="M676 311 H708 V352 H676 Z" class="clamp"/>
<path d="M190 363 V196 H95" class="call"/><text x="75" y="163" class="head">Console contact</text><text x="75" y="190" class="small">Round pin</text>
<path d="M540 354 V186 H430" class="call"/><text x="390" y="153" class="head">Spring socket</text><text x="390" y="180" class="small">Makes electrical contact</text>
<path d="M692 324 V185 H720" class="call"/><text x="733" y="153" class="head">Contact retention</text><text x="733" y="180" class="small">Holds socket in housing</text>
<path d="M940 326 V185 H1005" class="call"/><text x="1015" y="153" class="head">Cable restraint</text><text x="1015" y="180" class="small">Holds cable jacket</text>
<path d="M382 476 V566 H275" class="call"/><text x="75" y="596" class="small">Insulating plug housing</text>
<path d="M719 399 V566 H680" class="call"/><text x="570" y="596" class="small">Wire termination</text>
<path d="M1145 402 V566 H1200" class="call"/><text x="1210" y="596" class="small">Cable</text>
<text x="45" y="677" class="note">Schematic only. Contact shape, retention, cable restraint and mating tolerances require design and verification.</text>
<text x="45" y="707" class="note">The existing plug model contains empty contact channels; it does not establish the fit of this arrangement.</text>
