<path d="M105 260 H310 V304 H265 V447 H310 V492 H105 Z" class="shell"/>
<path d="M310 244 H1012 Q1040 244 1040 272 V311 H388 V441 H1040 V480 Q1040 508 1012 508 H310 V466 H350 V286 H310 Z" class="housing"/>
<!-- One representative console pin and the spring contact. -->
<rect x="190" y="363" width="355" height="25" rx="8" class="metal"/>
<path d="M455 342 H626 Q649 342 660 352 L735 352 V399 H660 Q649 410 626 410 H455" class="metal"/>
<path d="M455 354 H530 Q542 355 555 365 H617 M455 398 H530 Q542 397 555 387 H617" class="spring"/>
