<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Accessory plug — conceptual contact section</title>
<desc id="desc">A section through one proposed accessory-plug contact. A round console contact enters a spring socket retained in an insulating plug housing. A crimp connects the socket to a wire; a separate clamp holds the cable jacket. Other contacts, socket keying and dimensions are omitted. This is a functional diagram, not a proven mechanical design.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#183044;font-size:23px}.title{font-size:32px;font-weight:bold}.head{font-size:24px;font-weight:bold}.small{font-size:20px}.note{font-size:19px;fill:#435b6d}.call{fill:none;stroke:#294b68;stroke-width:2}.housing{fill:#dce7ed;stroke:#294b68;stroke-width:3}.shell{fill:#e9eff2;stroke:#294b68;stroke-width:3}.metal{fill:#c4a05e;stroke:#765b29;stroke-width:3}.spring{fill:none;stroke:#765b29;stroke-width:6;stroke-linecap:round}.wire{fill:none;stroke:#b45348;stroke-width:12}.jacket{fill:#687c8a;stroke:#294b68;stroke-width:3}.clamp{fill:#9aafbc;stroke:#294b68;stroke-width:3}
</style></defs>
<rect width="1400" height="760" fill="#fff"/>
<text x="45" y="53" class="title">Accessory plug — conceptual contact section</text>
<text x="45" y="91" class="small">One of nine contacts · seated view · not to scale</text>
