<rect x="35" y="810" width="1510" height="145" rx="10" class="core"/>
<text x="60" y="849" class="head">Startup sequence</text>
<text x="60" y="881" class="minor">1 · Native reset starts private firmware.   2 · Firmware establishes BLua32 state and enters the guest BIOS.</text>
<text x="60" y="911" class="minor">3 · BIOS selects a bootable cartridge; cartridge instruction fetches remain bound to that socket.</text>
<text x="60" y="940" class="minor">The interpreter, storage size, arithmetic throughput and event timing remain unqualified; existing public contracts are unchanged.</text>
