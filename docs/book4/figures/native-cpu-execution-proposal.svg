<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
<title id="title">Proposed native execution of BLua32</title>
<desc id="desc">A possible CORE implementation uses a conventional 32-bit native processor running an interpreter from private on-chip firmware ROM. The interpreter maintains BLua32 state using separate private runtime storage. At reset it initializes the guest and reads the BLua32 BIOS from the public system ROM; the BIOS chooses a cartridge. Guest instructions and data use the public system ROM, cartridge and 4 MiB main RAM through their existing paths. GTE, GEO, IMGDEC and DMA are separate hardware engines. Firmware capacity, runtime storage and real-time performance are not established.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#294b68"/></marker>
 <style>
 text{font-family:Arial,sans-serif;fill:#183044;font-size:21px}.title{font-size:29px;font-weight:bold}.head{font-size:22px;font-weight:bold}.minor{font-size:18px}.core{fill:#fbfcfd;stroke:#92a9b8;stroke-width:2}.block{fill:#e3eef5;stroke:#294b68;stroke-width:2}.memory{fill:#f4f7f8;stroke:#698495;stroke-width:2}.candidate{fill:#fff5e4;stroke:#9a7135;stroke-width:2;stroke-dasharray:8 5}.wire{fill:none;stroke:#294b68;stroke-width:3;marker-end:url(#arrow)}.bus{fill:none;stroke:#294b68;stroke-width:3}.both{marker-start:url(#arrow)}.dashed{stroke-dasharray:8 5}
 </style>
