<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title description">
<title id="title">BMSX memory ownership and local GFX service</title>
<desc id="description">CORE parks an uncommitted pad APPLY without owning SYS. U1 arbitrates complete packets between CORE and APU and selects U7 ROM, U7 INPUT or its cartridge ROM controller. The GFX local scheduler separately reserves raw-word result storage and partitions a sixty-four-slot SRAM calendar between two display circuits and renderer reads and writes.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#324d63"/></marker>
  <style>
    text{font-family:DejaVu Sans,sans-serif;font-size:23px;fill:#203747}
    .heading{font-size:32px;font-weight:700}
    .title{font-size:25px;font-weight:700}
    .small{font-size:20px;fill:#395567}
    .panel{fill:#f6f8fa;stroke:#a4b3bd;stroke-width:2}
    .owner{fill:#e5eff6;stroke:#486b82;stroke-width:2}
    .buffer{fill:#e8f4ef;stroke:#458169;stroke-width:2}
    .target{fill:white;stroke:#486b82;stroke-width:2}
    .render{fill:#fcf0d9;stroke:#a7823c;stroke-width:2}
    .line{fill:none;stroke:#324d63;stroke-width:3;marker-end:url(#arrow)}
    .both{marker-start:url(#arrow)}
    .bus{fill:#dce8f0;stroke:#486b82;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="1260" fill="white"/>
<rect x="25" y="20" width="1550" height="610" rx="12" class="panel"/>
<text x="55" y="65" class="heading">SYS ownership: a waiting logical write does not hold the conductors</text>
<rect x="55" y="95" width="410" height="160" rx="8" class="owner"/>
<text x="80" y="133" class="title">CORE pending APPLY</text>
<text x="80" y="169">Retain owner + original write</text>
<text x="80" y="204">Query → deadline → local wait</text>
<text x="80" y="237" class="small">Latch operands at APPLY DATA ACK</text>
<rect x="595" y="95" width="410" height="160" rx="8" class="owner"/>
<text x="620" y="133" class="title">U1 packet arbiter</text>
<text x="620" y="169">CORE grant / GNT_APU</text>
<text x="620" y="204">No pre-emption inside DATA</text>
<text x="620" y="237" class="small">Two quiet clocks before handover</text>
<rect x="1135" y="95" width="410" height="160" rx="8" class="owner"/>
<text x="1160" y="133" class="title">APU ROM word reader</text>
<text x="1160" y="169">REQ_APU held through release</text>
<text x="1160" y="204">Retain result for consumer</text>
<text x="1160" y="237" class="small">Bound socket travels with address</text>
<path d="M465 171H595" class="line both"/>
<path d="M1135 171H1005" class="line both"/>
<path d="M800 255V300" class="line"/>
<rect x="55" y="300" width="1490" height="62" rx="6" class="bus"/>
<text x="800" y="340" text-anchor="middle">SYS_AD[31:0] + shared controls · one initiator drives · selected target acknowledges</text>
<path d="M260 362V416" class="line both"/>
<path d="M800 362V416" class="line both"/>
<path d="M1340 362V416" class="line both"/>
<rect x="55" y="416" width="410" height="166" rx="8" class="target"/>
<text x="80" y="453" class="title">U7 firmware endpoint</text>
<text x="80" y="490">Two 16-bit flash reads per word</text>
<text x="80" y="526">Same endpoint for CORE and APU</text>
<text x="80" y="560" class="small">U1 selects ROM under either grant</text>
<rect x="595" y="416" width="410" height="166" rx="8" class="target"/>
<text x="620" y="453" class="title">U7 frame reservation</text>
<text x="620" y="490">E: reserve/query · D: cancel</text>
<text x="620" y="526">Zero: hold the next frame start</text>
<text x="620" y="560" class="small">Query holds credit, not operands</text>
<rect x="1135" y="416" width="410" height="166" rx="8" class="target"/>
<text x="1160" y="453" class="title">U1 cartridge ROM owner</text>
<text x="1160" y="490">CORE / APU word arbitration</text>
<text x="1160" y="526">Latch socket across A and A+2</text>
<text x="1160" y="560" class="small">16-bit buffered CAD → selected card</text>
<text x="55" y="610" class="small">Independent CORE DRAM access and refresh continue while the original APPLY waits.</text>

<rect x="25" y="655" width="1550" height="580" rx="12" class="panel"/>
<text x="55" y="700" class="heading">GFX local memory: reserve the result before issuing an SRAM read</text>
<rect x="55" y="740" width="355" height="126" rx="8" class="buffer"/>
<text x="78" y="777" class="title">Display circuit 1</text>
<text x="78" y="811">128 reserved word entries</text>
<text x="78" y="844" class="small">Raw word + tag + address</text>
<rect x="55" y="907" width="355" height="126" rx="8" class="buffer"/>
<text x="78" y="944" class="title">Display circuit 2</text>
<text x="78" y="978">128 reserved word entries</text>
<text x="78" y="1011" class="small">Separate consumer readiness</text>
<path d="M410 803H455V866H500" class="line both"/>
<path d="M410 970H455V902H500" class="line both"/>
<rect x="500" y="785" width="510" height="165" rx="8" class="owner"/>
<text x="525" y="824" class="title">54 MHz memory scheduler</text>
<text x="525" y="860">Display preference 1, 1, 2</text>
<text x="525" y="896">Result owner + tag retained in flight</text>
<text x="525" y="929" class="small">Return raw words to their own ring</text>
<path d="M1010 868H1135" class="line both"/>
<rect x="1135" y="785" width="410" height="165" rx="8" class="target"/>
<text x="1160" y="824" class="title">U30 + U31 video SRAM</text>
<text x="1160" y="860">512K × 32-bit words · 2 MiB</text>
<text x="1160" y="896">One-slot reads / two-slot writes</text>
<text x="1160" y="929" class="small">Direction guards / byte-masked writes</text>
<rect x="500" y="995" width="1045" height="70" rx="8" class="render"/>
<text x="1022" y="1024" text-anchor="middle" class="title">Renderer read / write requests and 128 reserved completions</text>
<text x="1022" y="1052" text-anchor="middle" class="small">Texture, destination, mask, blend and copy work share the same renderer interval</text>
<path d="M755 995V950" class="line both"/>
<rect x="55" y="1100" width="1060" height="54" fill="#cce8dc" stroke="#458169" stroke-width="2"/>
<rect x="1115" y="1100" width="25" height="54" fill="#dce0e4" stroke="#7f909e" stroke-width="2"/>
<rect x="1140" y="1100" width="380" height="54" fill="#f5e0b5" stroke="#a7823c" stroke-width="2"/>
<rect x="1520" y="1100" width="25" height="54" fill="#dce0e4" stroke="#7f909e" stroke-width="2"/>
<text x="585" y="1135" text-anchor="middle">Slots 0–47: display reads only · 32 / 16 when both streams are pending</text>
<text x="1330" y="1135" text-anchor="middle">49–62: renderer · 14 slots</text>
<text x="55" y="1197" class="small">Slots 48 and 63 are guards. Raw-word reservation capacity does not set a decoded-pixel deadline.</text>
</svg>
