<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
<title id="title">Proposed external-supply fault response</title>
<desc id="desc">Functional proposal, not fitted: the 3.3 V and 5 V rails feed separately monitored switches for both cartridge sockets, two switches for the shared four-pad supply, and one 5 V keyboard switch. Any branch fault sets a latch powered by VCTRL3V3. The latch inhibits the common buck enable; the existing supervisor observes the falling rails and asserts reset. Signal isolation and transient backfeed remain to be designed.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#294b68"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#183044;font-size:23px}
    .title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.small{font-size:20px}.note{font-size:19px}
    .box{fill:#edf3f6;stroke:#294b68;stroke-width:2.5}.candidate{fill:#fff8e9;stroke:#a66b18;stroke-width:2.5;stroke-dasharray:9 5}
    .line{fill:none;stroke:#294b68;stroke-width:3;marker-end:url(#arrow)}.thin{fill:none;stroke:#294b68;stroke-width:2.5}
    .warn{fill:#fff8e9;stroke:#a66b18;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="1030" fill="white"/>
<text x="50" y="55" class="title">External-supply protection — proposal</text>
<text x="50" y="92" class="small">Functional arrangement only · branch switches and fault latch are not fitted in the current circuit</text>

<!-- The table names the seven switched supply paths; it is not a wiring or placement diagram. -->
<rect x="250" y="125" width="900" height="440" rx="12" class="candidate"/>
<text x="280" y="163" class="head">Proposed monitored external-supply branches</text>
<text x="670" y="208" text-anchor="middle" class="head">3.3 V</text>
<text x="880" y="208" text-anchor="middle" class="head">5 V</text>
<text x="340" y="274" class="head">Cartridge 1</text>
<text x="340" y="352" class="head">Cartridge 2</text>
<text x="340" y="430" class="head">Four pad ports</text>
<text x="340" y="508" class="head">Keyboard</text>
<rect x="590" y="235" width="160" height="58" rx="6" class="box"/><text x="670" y="271" text-anchor="middle" class="small">Switch + fault</text>
<rect x="800" y="235" width="160" height="58" rx="6" class="box"/><text x="880" y="271" text-anchor="middle" class="small">Switch + fault</text>
<rect x="590" y="313" width="160" height="58" rx="6" class="box"/><text x="670" y="349" text-anchor="middle" class="small">Switch + fault</text>
<rect x="800" y="313" width="160" height="58" rx="6" class="box"/><text x="880" y="349" text-anchor="middle" class="small">Switch + fault</text>
<rect x="590" y="391" width="160" height="58" rx="6" class="box"/><text x="670" y="427" text-anchor="middle" class="small">Switch + fault</text>
<rect x="800" y="391" width="160" height="58" rx="6" class="box"/><text x="880" y="427" text-anchor="middle" class="small">Switch + fault</text>
<text x="670" y="507" text-anchor="middle" class="small">—</text>
<rect x="800" y="469" width="160" height="58" rx="6" class="box"/><text x="880" y="505" text-anchor="middle" class="small">Switch + fault</text>
<text x="995" y="430" class="note">shared</text><text x="995" y="454" class="note">pad group</text>

<rect x="35" y="220" width="165" height="100" rx="8" class="box"/><text x="118" y="258" text-anchor="middle" class="head">V3V3</text><text x="118" y="289" text-anchor="middle" class="small">main rail</text>
<rect x="35" y="368" width="165" height="100" rx="8" class="box"/><text x="118" y="406" text-anchor="middle" class="head">V5</text><text x="118" y="437" text-anchor="middle" class="small">main rail</text>
<path d="M200 270 H250 M200 418 H250" class="line"/>
<rect x="1200" y="240" width="350" height="230" rx="8" class="box"/>
<text x="1375" y="280" text-anchor="middle" class="head">External connections</text>
<text x="1375" y="324" text-anchor="middle" class="small">Two cartridge sockets</text>
<text x="1375" y="358" text-anchor="middle" class="small">Four pad sockets</text>
<text x="1375" y="392" text-anchor="middle" class="small">One keyboard socket</text>
<text x="1375" y="432" text-anchor="middle" class="note">Pad supplies remain grouped</text>
<path d="M1150 350 H1200" class="line"/>

<!-- A control-supply latch holds a branch fault after the main rails fall. -->
<rect x="45" y="690" width="220" height="95" rx="8" class="box"/>
<text x="155" y="727" text-anchor="middle" class="head">VCTRL3V3</text><text x="155" y="757" text-anchor="middle" class="small">control supply</text>
<rect x="355" y="675" width="330" height="125" rx="8" class="candidate"/>
<text x="520" y="715" text-anchor="middle" class="head">Common fault latch</text><text x="520" y="749" text-anchor="middle" class="small">Holds while control power remains</text><text x="520" y="779" text-anchor="middle" class="small">Clear by disconnecting supply</text>
<path d="M265 737 H355" class="line"/>
<path d="M520 565 V675" class="line"/><text x="540" y="625" class="small">Any branch fault</text>
<rect x="810" y="590" width="250" height="56" rx="8" class="box"/>
<text x="935" y="625" text-anchor="middle" class="small">U64: RUN and input PG</text>
<path d="M935 646 V675" class="line"/>
<rect x="800" y="675" width="270" height="125" rx="8" class="candidate"/>
<text x="935" y="714" text-anchor="middle" class="head">Enable inhibit logic</text><text x="935" y="749" text-anchor="middle" class="small">U64 enable gated by latch</text><text x="935" y="779" text-anchor="middle" class="note">Drives both converters</text>
<path d="M685 737 H800" class="line"/>
<rect x="1190" y="675" width="360" height="125" rx="8" class="box"/>
<text x="1370" y="715" text-anchor="middle" class="head">Main rails fall</text><text x="1370" y="749" text-anchor="middle" class="small">U60 monitors V3V3 and V5</text><text x="1370" y="779" text-anchor="middle" class="small">Supervisor asserts RESET_N</text>
<path d="M1070 737 H1190" class="line"/>

<rect x="45" y="855" width="1510" height="130" rx="8" class="warn"/>
<text x="65" y="890" class="small">The pad switches protect the shared pad supply group, not each individual port. No port-current rating is established here.</text>
<text x="65" y="922" class="small">Fault signalling can be delayed: signal isolation, backfeed, startup and transient behavior still require design.</text>
<text x="65" y="954" class="small">A supply fault can interrupt the whole console; this diagram does not guarantee continued operation or immediate protection.</text>
</svg>
