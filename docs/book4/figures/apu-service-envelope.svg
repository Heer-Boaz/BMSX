<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#fff"/>
  <style>text{font-family:Arial,sans-serif;fill:#182c3d}.title{font-size:30px;font-weight:700}.sub{font-size:19px}.label{font-size:20px;font-weight:700}.value{font-size:17px}.note{font-size:18px}.muted{fill:#536774}</style>
  <text x="42" y="54" class="title">APU memory-service envelope</text>
  <text x="42" y="86" class="sub">Independent paths · 44,100 output frames/s · 768 system clocks per frame</text>
  <rect x="44" y="113" width="24" height="14" rx="2" fill="#1974a6"/><text x="80" y="127" class="note">Local sample RAM</text>
  <rect x="302" y="113" width="24" height="14" rx="2" fill="#d28125"/><text x="338" y="127" class="note">External SYS/CAD</text>
  <text x="902" y="127" class="note muted">Clock allocations, not percentages of one shared path</text>
  <g stroke="#dce4e8" stroke-width="1">
    <path d="M460 174V626 M630 174V626 M800 174V626 M970 174V626"/>
  </g>
  <path d="M1112.8 168V626" stroke="#b53b43" stroke-width="2" stroke-dasharray="7 5"/>
  <g class="value muted" text-anchor="middle"><text x="460" y="162">0</text><text x="630" y="162">200</text><text x="800" y="162">400</text><text x="970" y="162">600</text><text x="1112.8" y="162">768</text></g>
  <g>
    <text x="44" y="211" class="label">M4 · four active slots</text><text x="44" y="235" class="note muted">2 local mono + 1 stereo ROM + 1 generator</text>
    <rect x="460" y="194" width="280.5" height="15" rx="2" fill="#1974a6"/><text x="749" y="207" class="value">330</text>
    <rect x="460" y="217" width="112.2" height="15" rx="2" fill="#d28125"/><text x="580.2" y="230" class="value">132</text>
    <text x="44" y="277" class="label">M8 · eight active slots</text><text x="44" y="301" class="note muted">6 local mono + 1 stereo ROM + 1 generator</text>
    <rect x="460" y="260" width="340" height="15" rx="2" fill="#1974a6"/><text x="808" y="273" class="value">400</text>
    <rect x="460" y="283" width="112.2" height="15" rx="2" fill="#d28125"/><text x="580.2" y="296" class="value">132</text>
    <text x="44" y="343" class="label">M12 · twelve active slots</text><text x="44" y="367" class="note muted">8 local mono + 2 stereo ROM + 2 generators</text>
    <rect x="460" y="326" width="375.7" height="15" rx="2" fill="#1974a6"/><text x="844" y="339" class="value">442</text>
    <rect x="460" y="349" width="224.4" height="15" rx="2" fill="#d28125"/><text x="692.4" y="362" class="value">264</text>
    <text x="44" y="409" class="label">M16-A · sixteen active slots</text><text x="44" y="433" class="note muted">12 local mono + 2 BADP stereo + 2 generators</text>
    <rect x="460" y="392" width="435.2" height="15" rx="2" fill="#1974a6"/><text x="904" y="405" class="value">512</text>
    <rect x="460" y="415" width="448.8" height="15" rx="2" fill="#d28125"/><text x="916.8" y="428" class="value">528</text>
    <text x="44" y="475" class="label">M16-B · sixteen active slots</text><text x="44" y="499" class="note muted">12 local mono + 2 PCM stereo + 2 generators</text>
    <rect x="460" y="458" width="363.8" height="15" rx="2" fill="#1974a6"/><text x="832" y="471" class="value">428</text>
    <rect x="460" y="481" width="224.4" height="15" rx="2" fill="#d28125"/><text x="692.4" y="494" class="value">264</text>
    <text x="44" y="548" class="label">Boundary · 16 local stereo BADP</text><text x="44" y="572" class="note muted">Coincident block headers + upload writeback</text>
    <rect x="460" y="533" width="625.6" height="19" rx="2" fill="#1974a6"/><text x="1025" y="548" class="value" style="fill:#fff">736</text>
    <text x="44" y="610" class="label">Boundary · 4 reverse mono BADP</text><text x="44" y="634" class="note muted">Short loop [33,97) · repeated seeking</text>
    <rect x="460" y="595" width="768.4" height="19" rx="2" fill="#b53b43"/><text x="1238" y="611" class="value">904</text>
  </g>
  <rect x="42" y="668" width="1316" height="103" rx="9" fill="#eff4f6"/>
  <text x="62" y="696" class="note">Established playback; 32-word adverse inactive-buffer writeback; no persistent ROM cache.</text>
  <text x="62" y="724" class="note">ROM includes one 9-clock competing CORE packet per miss; card data/READY profile is 80/120 ns.</text>
  <text x="62" y="752" class="note">Cold PLAY, arithmetic, coherent batch publication and complete APU scheduling remain separate.</text>
</svg>
