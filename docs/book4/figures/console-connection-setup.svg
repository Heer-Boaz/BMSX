<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
<title id="title">Connecting the BMSX console</title>
<desc id="desc">Two schematic panels show the BMSX front and rear. On the front, a PS/2 keyboard connects to the left socket and BMSX pads connect to the four pad sockets. A separate top inset shows the two cartridge openings, with slot 2 behind slot 1. On the rear, a SCART RGB display and an isolated centre-positive 9 V DC supply connect to their respective sockets. The supply is disconnected while connecting peripherals or inserting cartridges.</desc>
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#183044;font-size:21px}.title{font-size:31px;font-weight:bold}.head{font-size:24px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:19px}.outline{fill:#e3e0d7;stroke:#294b68;stroke-width:3}.panel{fill:#f7f9fa;stroke:#b0bdc4;stroke-width:2}.dark{fill:#313d45;stroke:#192e39;stroke-width:3}.screen{fill:#e5edf1;stroke:#294b68;stroke-width:3}.key{fill:#f4f5f2;stroke:#667c88;stroke-width:1.2}.wire{fill:none;stroke:#31566f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.slot{fill:#1d262d;stroke:#192e39;stroke-width:2}.mark{fill:#fff;font-size:16px;font-weight:bold}.symbol{fill:none;stroke:#31566f;stroke-width:3}
</style>
</defs>
<rect width="1500" height="1020" fill="#fff"/>
<text x="48" y="51" class="title">Connecting the BMSX console</text>
<text x="48" y="84" class="small">Switch off and disconnect the external supply before connecting accessories or inserting cartridges.</text>
<rect x="40" y="110" width="1420" height="400" rx="14" class="panel"/>
<text x="65" y="150" class="head">FRONT AND CARTRIDGES</text>
<text x="1435" y="150" text-anchor="end" class="small">Keyboard and pads connect at the front</text>
<!-- top view inset: slots are arranged front-to-back, not side-by-side -->
<text x="702" y="176" class="small">TOP: cartridge openings</text>
<rect x="702" y="187" width="200" height="17" rx="3" class="slot"/>
<rect x="702" y="218" width="200" height="17" rx="3" class="slot"/>
<text x="914" y="202" class="small">2 (rear)</text><text x="914" y="233" class="small">1 (front)</text>
<!-- front panel: left keyboard, four pads -->
<rect x="480" y="262" width="575" height="129" rx="16" class="outline"/>
<path d="M480 312h575v59q0 20-20 20H500q-20 0-20-20z" class="dark"/>
<circle cx="536" cy="351" r="15" class="slot"/>
<rect x="652" y="336" width="56" height="31" rx="4" class="slot"/><rect x="743" y="336" width="56" height="31" rx="4" class="slot"/><rect x="834" y="336" width="56" height="31" rx="4" class="slot"/><rect x="925" y="336" width="56" height="31" rx="4" class="slot"/>
<text x="680" y="331" text-anchor="middle" class="mark">1</text><text x="771" y="331" text-anchor="middle" class="mark">2</text><text x="862" y="331" text-anchor="middle" class="mark">3</text><text x="953" y="331" text-anchor="middle" class="mark">4</text>
<text x="768" y="294" text-anchor="middle" class="label">BMSX</text>
<!-- keyboard left -->
<rect x="75" y="288" width="265" height="98" rx="9" class="outline"/>
<g class="key"><rect x="92" y="304" width="21" height="18"/><rect x="118" y="304" width="21" height="18"/><rect x="144" y="304" width="21" height="18"/><rect x="170" y="304" width="21" height="18"/><rect x="196" y="304" width="21" height="18"/><rect x="222" y="304" width="21" height="18"/><rect x="248" y="304" width="21" height="18"/><rect x="274" y="304" width="21" height="18"/><rect x="92" y="328" width="21" height="18"/><rect x="118" y="328" width="21" height="18"/><rect x="144" y="328" width="21" height="18"/><rect x="170" y="328" width="21" height="18"/><rect x="196" y="328" width="21" height="18"/><rect x="222" y="328" width="21" height="18"/><rect x="248" y="328" width="21" height="18"/><rect x="274" y="328" width="21" height="18"/><rect x="128" y="352" width="145" height="18"/></g>
<path d="M340 338 H422 V351 H521" class="wire"/><text x="208" y="425" text-anchor="middle" class="label">PS/2 keyboard</text>
<!-- one representative pad -->
<path d="M1130 321q20-22 67-22h116q47 0 67 22l24 56q5 23-18 24-13 0-32-16l-18-13h-162l-18 13q-19 16-32 16-23-1-18-24z" class="outline"/>
<path d="M1171 323v35 M1154 340h34" class="symbol"/><circle cx="1300" cy="327" r="6" class="dark"/><circle cx="1324" cy="342" r="6" class="dark"/><circle cx="1300" cy="357" r="6" class="dark"/><circle cx="1276" cy="342" r="6" class="dark"/>
<path d="M1127 344 H1064 V351 H981" class="wire"/><text x="1255" y="425" text-anchor="middle" class="label">BMSX pads 1–4</text>
<text x="768" y="471" text-anchor="middle" class="small">A separate pointer also uses one of these four pad sockets.</text>
<rect x="40" y="540" width="1420" height="380" rx="14" class="panel"/>
<text x="65" y="580" class="head">REAR</text><text x="1435" y="580" text-anchor="end" class="small">View facing the rear panel</text>
<!-- rear console: SCART to left, DC to right -->
<rect x="480" y="668" width="575" height="125" rx="16" class="outline"/>
<path d="M480 717h575v56q0 20-20 20H500q-20 0-20-20z" class="dark"/>
<path d="M533 735h115l-5 31H538z" class="slot"/><circle cx="995" cy="751" r="14" class="slot"/>
<text x="590" y="817" text-anchor="middle" class="small">SCART</text><text x="995" y="817" text-anchor="middle" class="small">DC IN</text>
<!-- display -->
<rect x="93" y="624" width="265" height="150" rx="8" class="dark"/><rect x="106" y="637" width="239" height="121" class="screen"/><path d="M225 774v26 M177 800h96" class="symbol"/>
<path d="M358 710 H426 V750 H533" class="wire"/><text x="225" y="840" text-anchor="middle" class="label">RGB-capable display</text><text x="225" y="868" text-anchor="middle" class="small">SCART: RGB, sync and stereo audio</text>
<!-- adapter -->
<rect x="1155" y="661" width="172" height="85" rx="12" class="dark"/><path d="M1143 680h12 M1143 708h12" class="symbol"/>
<path d="M1155 728 H1100 V751 H1009" class="wire"/><text x="1241" y="817" text-anchor="middle" class="label">Isolated DC supply</text><text x="1241" y="846" text-anchor="middle" class="small">9 V regulated · centre positive</text>
<text x="48" y="969" class="small">Connection overview only; plug details and cable shapes are schematic. The adapter current rating is not yet specified.</text>
</svg>
