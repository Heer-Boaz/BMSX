<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 850" role="img" aria-labelledby="title desc">
<title id="title">IMGDEC compressed stream and GPU upload path</title>
<desc id="desc">CPU or DMA writes compressed words through DATA to a 32-word input FIFO. A stream sequencer interprets tokens and routes literal, repeat, zero and history-copy payloads through an output multiplexer. A separate header generator inserts GPU upload headers without adding them to the 4096-word payload history. A 64-word output FIFO supplies DATA reads by CPU or DMA, which may deliver the output to GPU GP0 or RAM. Input and output DMA requests use a quantum of at most 16 words. DONE requires the complete output to be read along with the other terminal conditions. This is a functional diagram, not proof of physical timing.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#294b68"/></marker>
 <style>
  text{font-family:Arial,sans-serif;fill:#183044;font-size:21px}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}.small{font-size:18px}.device{fill:#edf4f8;stroke:#294b68;stroke-width:2}.store{fill:#f6f8f9;stroke:#678394;stroke-width:2}.control{fill:#fff4df;stroke:#997031;stroke-width:2}.line{fill:none;stroke:#294b68;stroke-width:3;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.ctl{fill:none;stroke:#997031;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1680" height="850" fill="white"/>
<text x="42" y="48" class="title">IMGDEC — compressed words to GPU upload</text>
<text x="42" y="81" class="small">Functional organisation in CORE; block and clock timing are not established by this drawing.</text>

<rect x="35" y="180" width="165" height="130" rx="8" class="device"/>
<text x="117" y="217" text-anchor="middle" class="head">DATA write</text>
<text x="117" y="249" text-anchor="middle" class="small">CPU or DMA</text>
<text x="117" y="275" text-anchor="middle" class="small">compressed words</text>

<rect x="245" y="180" width="185" height="130" rx="8" class="store"/>
<text x="337" y="217" text-anchor="middle" class="head">Input FIFO</text>
<text x="337" y="249" text-anchor="middle" class="small">32 words</text>
<text x="337" y="275" text-anchor="middle" class="small">compressed input</text>

<rect x="475" y="180" width="220" height="130" rx="8" class="control"/>
<text x="585" y="217" text-anchor="middle" class="head">Stream control</text>
<text x="585" y="249" text-anchor="middle" class="small">header and endpoints</text>
<text x="585" y="275" text-anchor="middle" class="small">token sequencing</text>

<rect x="740" y="180" width="225" height="130" rx="8" class="device"/>
<text x="852" y="217" text-anchor="middle" class="head">Payload engine</text>
<text x="852" y="249" text-anchor="middle" class="small">literal · repeat · zero</text>
<text x="852" y="275" text-anchor="middle" class="small">history copy</text>

<rect x="1010" y="180" width="190" height="130" rx="8" class="device"/>
<text x="1105" y="217" text-anchor="middle" class="head">Output mux</text>
<text x="1105" y="249" text-anchor="middle" class="small">headers or payload</text>
<text x="1105" y="275" text-anchor="middle" class="small">in stream order</text>

<rect x="1245" y="180" width="190" height="130" rx="8" class="store"/>
<text x="1340" y="217" text-anchor="middle" class="head">Output FIFO</text>
<text x="1340" y="249" text-anchor="middle" class="small">64 words</text>
<text x="1340" y="275" text-anchor="middle" class="small">generated packets</text>

<rect x="1480" y="180" width="165" height="130" rx="8" class="device"/>
<text x="1562" y="217" text-anchor="middle" class="head">DATA read</text>
<text x="1562" y="249" text-anchor="middle" class="small">CPU or DMA</text>
<text x="1562" y="275" text-anchor="middle" class="small">output words</text>

<path d="M200 245H245" class="line"/><path d="M430 245H475" class="line"/>
<path d="M695 245H740" class="line"/><path d="M965 245H1010" class="line"/>
<path d="M1200 245H1245" class="line"/><path d="M1435 245H1480" class="line"/>

<rect x="730" y="400" width="245" height="124" rx="8" class="store"/>
<text x="852" y="438" text-anchor="middle" class="head">Payload history</text>
<text x="852" y="469" text-anchor="middle" class="small">4096 words</text>
<text x="852" y="495" text-anchor="middle" class="small">overlapping copies</text>
<path d="M852 310V400" class="line both"/>

<rect x="465" y="400" width="240" height="124" rx="8" class="control"/>
<text x="585" y="438" text-anchor="middle" class="head">Upload headers</text>
<text x="585" y="469" text-anchor="middle" class="small">texture and palette</text>
<text x="585" y="495" text-anchor="middle" class="small">not payload history</text>
<path d="M585 310V400" class="line"/>
<path d="M705 465H715V365H1105V310" class="line"/>

<rect x="1430" y="400" width="220" height="124" rx="8" class="device"/>
<text x="1540" y="438" text-anchor="middle" class="head">Consumer</text>
<text x="1540" y="469" text-anchor="middle" class="small">GPU GP0 or RAM</text>
<text x="1540" y="495" text-anchor="middle" class="small">via CPU or DMA</text>
<path d="M1562 310V400" class="line"/>

<rect x="35" y="620" width="1610" height="150" rx="10" fill="#fafbfc" stroke="#9aadb9" stroke-width="2"/>
<text x="65" y="656" class="head">Flow control and completion</text>
<text x="65" y="687" class="small">DMA requests use a block of up to 16 words, or the shorter remaining tail; a one-word CPU access has separate readiness rules.</text>
<text x="65" y="716" class="small">DONE requires the whole expected output, including generated headers, to be read and the other stream-completion conditions to hold.</text>
<text x="65" y="745" class="small">A supervisor pause withdraws requests and retains stream state; it does not itself complete or duplicate the decoder.</text>
</svg>
