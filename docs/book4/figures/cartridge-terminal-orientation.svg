<title id="title">Cartridge PCB terminal orientation, top view</title>
<desc id="desc">Front case slot1 is controller socket0; rear case slot2 is controller socket1. Looking down into the console, rowA is frontward, rowB rearward, and both rows run from position1 at left to31 at right. This is not a cartridge-face or solder-side view.</desc>
