<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000">
  <title>APU service organization — physical integration proposal</title>
  <desc>Separate preparation, fixed-rate rendering and local-memory publication. One frame scheduler coordinates sixteen native slot states, a shared decoder and shared arithmetic. Dashed blocks are proposed integration, not a qualified complete APU.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#53687d"/></marker>
    <style>
      text { font-family: 'DejaVu Sans',sans-serif; fill:#233246; }
      .heading { font-size:29px; font-weight:700; }
      .subtitle { font-size:16px; fill:#53687d; }
      .section { font-size:18px; font-weight:700; }
      .label { font-size:15px; font-weight:700; }
      .body { font-size:15px; }
      .small { font-size:13px; fill:#42566b; }
      .band { fill:#f6f8fb; stroke:#c9d3df; stroke-width:1.5; }
      .proposal { fill:#eaf1f9; stroke:#6989ad; stroke-width:2; stroke-dasharray:7 4; }
      .existing { fill:#e8f4ed; stroke:#438360; stroke-width:2; }
      .external { fill:#fff4dd; stroke:#af8b45; stroke-width:2; }
      .flow { fill:none; stroke:#53687d; stroke-width:2; marker-end:url(#arrow); }
      .memory { fill:none; stroke:#53687d; stroke-width:2; marker-start:url(#arrow); marker-end:url(#arrow); }
      .prepare { fill:none; stroke:#6989ad; stroke-width:2; stroke-dasharray:7 4; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1360" height="1000" fill="white"/>
  <text x="34" y="48" class="heading">APU service organization</text>
  <text x="34" y="78" class="subtitle">Physical integration proposal · sixteen native slots · eight-stereo qualification target</text>

  <rect x="20" y="108" width="1320" height="185" rx="12" class="band"/>
  <text x="42" y="139" class="section">CONTROL AND PREPARATION — variable work, separate from the output cadence</text>
  <rect x="55" y="158" width="275" height="105" rx="8" class="proposal"/>
  <text x="72" y="185" class="label">Command / live access</text>
  <text x="72" y="211" class="body"><tspan x="72">Captured words stay ordered.</tspan><tspan x="72" dy="23">Live access is not queued PLAY.</tspan></text>
  <path d="M330 209 H373" class="flow"/>
  <rect x="380" y="158" width="330" height="105" rx="8" class="proposal"/>
  <text x="397" y="185" class="label">Bind, phase and seek preparation</text>
  <text x="397" y="211" class="body"><tspan x="397">Private candidate state; source tags.</tspan><tspan x="397" dy="23">No early overwrite of the active voice.</tspan></text>
  <path d="M710 209 H752" class="flow"/>
  <rect x="760" y="158" width="545" height="105" rx="8" class="proposal"/>
  <text x="777" y="185" class="label">Architectural acceptance / execution boundary</text>
  <text x="777" y="211" class="body"><tspan x="777">Preserve binding selection, failed-PLAY survival and live-write order.</tspan><tspan x="777" dy="23">Preparation latency and bus acceptance still need closure.</tspan></text>

  <rect x="20" y="315" width="1320" height="304" rx="12" class="band"/>
  <text x="42" y="345" class="section">REAL-TIME RENDER — one owner for each 44.1 kHz output epoch</text>
  <rect x="54" y="363" width="1250" height="43" rx="5" class="proposal"/>
  <text x="70" y="389" class="body">Frame scheduler: source epoch, slot/phase state, filter histories, fade/events and ordered writeback</text>
  <path d="M1278 263 V308 H1290 V363" class="prepare"/>
  <rect x="54" y="431" width="188" height="103" rx="8" class="existing"/>
  <text x="68" y="457" class="label">16 decoder contexts</text>
  <text x="68" y="483" class="body"><tspan x="68">Current / previous PCM.</tspan><tspan x="68" dy="22">Predictors and indices.</tspan><tspan x="68" dy="22">Canonical loop state.</tspan></text>
  <path d="M242 480 H279" class="flow"/>
  <rect x="286" y="431" width="205" height="103" rx="8" class="proposal"/>
  <text x="300" y="457" class="label">Shared source jobs</text>
  <text x="300" y="483" class="body"><tspan x="300">Bounded service quanta.</tspan><tspan x="300" dy="22">Banked decode progress.</tspan><tspan x="300" dy="22">Existing BADP core reused.</tspan></text>
  <path d="M491 480 H525" class="flow"/>
  <rect x="532" y="431" width="126" height="103" rx="8" class="proposal"/>
  <text x="545" y="457" class="label">Operand pair</text>
  <text x="545" y="483" class="body"><tspan x="545">Epoch-tagged</tspan><tspan x="545" dy="22">L/R latches.</tspan></text>
  <path d="M658 480 H700" class="flow"/>
  <rect x="707" y="431" width="225" height="103" rx="8" class="proposal"/>
  <text x="721" y="457" class="label">Shared arithmetic lane</text>
  <text x="721" y="483" class="body"><tspan x="721">Interpolation → Q14 filter</tspan><tspan x="721" dy="22">→ full Q12 gain products.</tspan><tspan x="721" dy="22">Signed 17 × 32 candidate.</tspan></text>
  <path d="M932 480 H969" class="flow"/>
  <rect x="976" y="431" width="184" height="103" rx="8" class="proposal"/>
  <text x="990" y="457" class="label">Stereo mix</text>
  <text x="990" y="483" class="body"><tspan x="990">64-bit Q12 sums.</tspan><tspan x="990" dy="22">One final ASR12</tspan><tspan x="990" dy="22">and signed16 clip.</tspan></text>
  <path d="M1160 480 H1194" class="flow"/>
  <rect x="1201" y="431" width="103" height="103" rx="8" class="proposal"/>
  <text x="1213" y="457" class="label">Output</text>
  <text x="1213" y="483" class="body"><tspan x="1213">Frame latch</tspan><tspan x="1213" dy="22">and DAC.</tspan></text>
  <text x="54" y="567" class="small">Retained PCM survives source writes.</text>
  <text x="54" y="590" class="small">Filter feedback: unclipped y; gain input: clipped sample.</text>
  <text x="549" y="567" class="small">Source fetch/decode and arithmetic overlap; pipeline fill and data dependencies remain budgeted work.</text>
  <text x="549" y="590" class="small">112 products for eight filtered stereo voices is issue demand, not a complete frame-time proof.</text>

  <path d="M388 534 V652 H984 V732" class="memory"/>
  <path d="M405 263 V279 H258 V418 H387 V431" class="prepare"/>
  <text x="60" y="646" class="small">Preparation shares the decode service and memory port; a long seek must yield at a bounded safe boundary.</text>
  <rect x="20" y="682" width="1320" height="199" rx="12" class="band"/>
  <text x="42" y="710" class="section">LOCAL MEMORY — ordered publication and one physical RAM port</text>
  <rect x="54" y="732" width="230" height="98" rx="8" class="proposal"/>
  <text x="70" y="759" class="label">Transfer ingress</text>
  <text x="70" y="785" class="body"><tspan x="70">DMA FIFO / manual stores.</tspan><tspan x="70" dy="22">Admission remains to be closed.</tspan></text>
  <path d="M284 779 H322" class="flow"/>
  <rect x="329" y="732" width="212" height="98" rx="8" class="existing"/>
  <text x="343" y="759" class="label">Staged publication</text>
  <text x="343" y="785" class="body"><tspan x="343">DMA batch at 32 × N.</tspan><tspan x="343" dy="22">Source-change boundary.</tspan></text>
  <path d="M541 779 H577" class="flow"/>
  <rect x="584" y="732" width="226" height="98" rx="8" class="existing"/>
  <text x="598" y="759" class="label">Committed-prefix view</text>
  <text x="598" y="785" class="body"><tspan x="598">Render-epoch isolation.</tspan><tspan x="598" dy="22">Queued words / forwarding.</tspan></text>
  <path d="M810 779 H846" class="flow"/>
  <rect x="853" y="732" width="209" height="98" rx="8" class="existing"/>
  <text x="867" y="759" class="label">Native sample store</text>
  <text x="867" y="785" class="body"><tspan x="867">One physical word port.</tspan><tspan x="867" dy="22">Read / write pin timing.</tspan></text>
  <path d="M1062 779 H1097" class="memory"/>
  <rect x="1104" y="732" width="200" height="98" rx="8" class="external"/>
  <text x="1118" y="759" class="label">512 KiB sample RAM</text>
  <text x="1118" y="785" class="body"><tspan x="1118">External x16 SRAM.</tspan><tspan x="1118" dy="22">No hidden PCM mirror.</tspan></text>
  <path d="M169 830 V843 H697 V831" class="prepare"/>
  <text x="54" y="865" class="small">Manual commit at write acceptance.</text>
  <text x="329" y="858" class="small">The final service calendar must cover render fetches, batch writeback and bounded preparation without starvation.</text>
  <rect x="40" y="907" width="24" height="16" class="existing"/><text x="76" y="921" class="small">Existing decoder / memory building blocks</text>
  <rect x="432" y="907" width="24" height="16" class="proposal"/><text x="468" y="921" class="small">Proposed end-to-end integration, not completed or timing-qualified circuitry</text>
  <text x="40" y="957" class="body">No new slot limit, launch delay, rate clamp or sample-format restriction is assigned by this proposal.</text>
  <text x="40" y="981" class="small">Queued PLAY preparation and synchronous live START/source access remain separate architectural obligations.</text>
</svg>
