<path d="M825 222 H1265 V268 H1248 V310 H1265 V368 H825 Z" class="dash"/>
<g class="pocket"><circle cx="905" cy="316" r="9"/><circle cx="985" cy="316" r="9"/><circle cx="1065" cy="316" r="9"/><circle cx="1145" cy="316" r="9"/><circle cx="1225" cy="316" r="9"/><circle cx="945" cy="268" r="9"/><circle cx="1025" cy="268" r="9"/><circle cx="1105" cy="268" r="9"/><circle cx="1185" cy="268" r="9"/></g>
<g class="num" text-anchor="middle"><text x="905" y="355">1</text><text x="985" y="355">2</text><text x="1065" y="355">3</text><text x="1145" y="355">4</text><text x="1225" y="355">5</text><text x="945" y="254">6</text><text x="1025" y="254">7</text><text x="1105" y="254">8</text><text x="1185" y="254">9</text></g>
