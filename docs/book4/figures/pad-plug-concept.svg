<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">BMSX pad connector — proposed cable plug</title>
<desc id="desc">Schematic view facing a console socket and a transparent view through the rear of the cable plug in the same direction. The five lower and four upper contacts align by number. An indexing rib at the right of the socket is intended to fit a corresponding groove in the plug nose. A side view shows a plug body, proposed seating shoulder, flexible cable exit and console front.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#183044;font-size:21px}.title{font-size:29px;font-weight:bold}.head{font-size:22px;font-weight:bold}.small{font-size:18px}.num{font-size:19px;font-weight:bold}.shell{fill:#e1eaf0;stroke:#294b68;stroke-width:3}.hole{fill:#fff;stroke:#294b68;stroke-width:3}.pin{fill:#bd9851;stroke:#765b29;stroke-width:2}.pocket{fill:#fff;stroke:#765b29;stroke-width:3}.dash{fill:none;stroke:#9b6d21;stroke-width:4;stroke-dasharray:8 5}.call{fill:none;stroke:#294b68;stroke-width:2}</style></defs>
<rect width="1400" height="780" fill="white"/>
