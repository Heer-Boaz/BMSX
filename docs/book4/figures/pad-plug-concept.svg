<g class="num" text-anchor="middle"><text x="175" y="355">1</text><text x="255" y="355">2</text><text x="335" y="355">3</text><text x="415" y="355">4</text><text x="495" y="355">5</text><text x="215" y="254">6</text><text x="295" y="254">7</text><text x="375" y="254">8</text><text x="455" y="254">9</text></g>
<path d="M527 289 H600" class="call"/><text x="605" y="295" class="small">Indexing rib</text>
