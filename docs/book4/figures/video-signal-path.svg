<text x="1360" y="475" text-anchor="middle" class="sub">U42 buffer · U43 filter</text>
<text x="1360" y="503" text-anchor="middle" class="tiny">Low is sync tip</text>
<rect x="1200" y="675" width="320" height="93" rx="8" class="storage"/>
<text x="1360" y="713" text-anchor="middle" class="head">SCART output</text>
<text x="1360" y="741" text-anchor="middle" class="sub">RGB and composite sync</text>
<path d="M1530 274 H1560 V721 H1520" class="line"/>
<path d="M1360 535 V675" class="line"/>
<text x="45" y="847" class="sub">Dashed paths are the proposed physical phase and pulse service. The 13.5 MHz reference also clocks the DAC.</text>
<text x="45" y="882" class="sub">The live VSINT event is not defined by the analogue pin edge. Clock transfer, path alignment and display compatibility remain open.</text>
</svg>
