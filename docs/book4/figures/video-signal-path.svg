<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">BMSX video timing and output proposal</title>
<desc id="desc">Functional diagram of the proposed GFX video output. The programmer-visible live beam and VSINT are logically distinct from the displayed timing state. A candidate phase and pulse sequencer uses that displayed state and the 13.5 MHz reference to coordinate the compositor's RGB and blanking with the separate composite-sync path. Video RAM supplies the display circuits. RGB passes through the DAC while composite sync passes through a buffer and filter before both reach SCART. The two examples use this same proposed architecture; the complete implementation and display compatibility are not established.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294b68"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183044;font-size:22px}.title{font-size:34px;font-weight:bold}.head{font-size:25px;font-weight:bold}.sub{font-size:20px}.tiny{font-size:18px}.chip{fill:#e3eff5;stroke:#294b68;stroke-width:2.5}.storage{fill:#f3f6f7;stroke:#294b68;stroke-width:2}.proposal{fill:#fff8e8;stroke:#9b6d21;stroke-width:2.5;stroke-dasharray:8 5}.group{fill:#fbfcfd;stroke:#93a9b8;stroke-width:2}.line{fill:none;stroke:#294b68;stroke-width:3;marker-end:url(#arrow)}.timing{fill:none;stroke:#9b6d21;stroke-width:3;stroke-dasharray:8 5;marker-end:url(#arrow)}</style>
</defs>
