  .heading{font-size:31px;font-weight:bold}
  .section{font-size:23px;font-weight:bold;letter-spacing:1px}
  .label{font-size:22px;font-weight:bold}
  .detail{font-size:17px;fill:#4d6373}
  .outline{fill:#eae7df;stroke:#43596b;stroke-width:3}
  .dark{fill:#29333a;stroke:#182d3a;stroke-width:2}
  .opening{fill:#111a20;stroke:#7b8e99;stroke-width:2}
  .line{fill:none;stroke:#6e8798;stroke-width:2}
  .contact{fill:#d7c48c}
 </style>
</defs>
