<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
<title id="title">BMSX console connections and controls</title>
<desc id="desc">Front view shows the keyboard socket on the left followed by four game-pad sockets. Rear view shows the SCART audio/video socket and DC inlet. Top view shows two cartridge doors and the POWER control, indicator and RESET button on the front band.</desc>
<defs>
 <style>
