<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 1110" role="img" aria-labelledby="title desc">
<title id="title">SCART socket, bearing stack and numbered termination board</title>
<desc id="desc">Kycon K-SCART-021 A4 nominal drawing establishes the 58.4 mm ear pitch, 3.7 mm bores, 3 mm flange and numbered through-hole tail pattern. The local board and carrier are console-designed parts; legacy procurement and manufactured assembly remain unqualified.</desc>
