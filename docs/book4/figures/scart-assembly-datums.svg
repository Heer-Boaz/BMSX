<text x="192.4" y="471" text-anchor="middle" class="small">Slot X149.8</text><text x="659.6" y="471" text-anchor="middle" class="small">Slot X208.2</text>
<text x="426" y="446" text-anchor="middle" class="tiny">Own slots are 2.2 wide; Z42 is an assembly reference, not a supplier datum.</text>
<text x="65" y="515">Overall front: 65.80 × 16.50; own body-bottom reference Z33.</text>
<text x="65" y="545" class="small">Align the body/PCB to the aperture, then clamp through the actual ear holes.</text>
