<text x="840" y="714" class="bold">Manufacturer contact grid</text>
<text x="840" y="746" class="small">Odd 1–21: inward depth 15.78, pitch 3.81</text>
<text x="840" y="776" class="small">Even 2–20: depth 10.70, stagger 1.905</text>
<text x="840" y="806" class="small">Recommended tail drill Ø1.30; metal section not assumed</text>
<text x="840" y="847" class="bold">Own board and leads</text>
<text x="840" y="879" class="small">PCB top Z33, underside Z31.4; nominal tail ends Z29</text>
<text x="840" y="909" class="small">J2 joints accept each coax centre/return and auxiliary lead</text>
<text x="85" y="925" class="tiny">Underside SMD joints are projected in amber; socket mapping follows the numbered circuit, not apparent left/right.</text>
<text x="45" y="983" class="bold">Reference and assembly scope</text>
<text x="45" y="1017" class="small">Kycon drawing A4, 9 August 2000 (original drawing 10 August 1995). Selected original-part procurement is unconfirmed.</text>
<text x="45" y="1047" class="small">The related K-SCARTX-021 variant was discontinued in 2017; that notice is not an active-source assurance for this reference part.</text>
<text x="45" y="1077" class="small">No copper is routed. Incoming dimensions, joints, retention and loaded analogue performance still require assembly qualification.</text>
