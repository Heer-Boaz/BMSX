<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">ROM-only cartridge reference organisation</title>
<desc id="desc">An illustrative ROM-only cartridge contains a 62-contact BMSX card edge, a card-side interface controller and an example 8 MiB 16-bit flash. The controller captures multiplexed addresses, selects the installed flash region, handles reads and acknowledgements, and drives the cartridge data bus. A local power-on reset supervises the controller and flash separately from the logical reset on the card edge. Flash WE is held inactive in console operation; the controller waits for flash recovery before acknowledging ROM reads. Card contact B25 joins ground as a presence indication. This is a functional proposal, not a complete electrical schematic or routed card.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#294b68"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#183044;font-size:23px}.title{font-size:34px;font-weight:bold}.head{font-size:27px;font-weight:bold}.small{font-size:19px}.note{font-size:19px;fill:#40596b}.part{fill:#e5f0f5;stroke:#294b68;stroke-width:3}.edge{fill:#f2f6f8;stroke:#294b68;stroke-width:3}.rom{fill:#f6f5ef;stroke:#294b68;stroke-width:3}.line{fill:none;stroke:#294b68;stroke-width:3;marker-end:url(#arrow)}.bus{fill:none;stroke:#294b68;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.wire{fill:none;stroke:#294b68;stroke-width:3}</style>
</defs>
<rect width="1600" height="1060" fill="#fff"/>
<text x="55" y="60" class="title">ROM-only cartridge — functional reference proposal</text>
<text x="55" y="96" class="small">One card-specific implementation · not a complete electrical schematic, parts list or routed board</text>
<rect x="60" y="150" width="300" height="435" rx="10" class="edge"/>
<text x="210" y="194" text-anchor="middle" class="head">BMSX card edge</text>
<text x="210" y="231" text-anchor="middle" class="small">62 contacts</text>
<text x="87" y="288" class="small">CAD[15:0]</text>
<text x="87" y="365" class="small">CAL_LO / CAL_HI</text>
<text x="87" y="394" class="small">CBE[1:0]_N</text>
<text x="87" y="423" class="small">CS_N / CRD_N / CWR_N</text>
<text x="87" y="452" class="small">CART_CLK / CART_RESET_N</text>
<text x="87" y="522" class="small">READY_N</text>
<rect x="530" y="180" width="465" height="385" rx="10" class="part"/>
<text x="762.5" y="225" text-anchor="middle" class="head">Card-side interface controller</text>
<text x="562" y="275" class="small">Capture address portions and operation width</text>
<text x="562" y="313" class="small">Decode ROM window and installed capacity</text>
<text x="562" y="351" class="small">Assemble little-endian byte, halfword or word</text>
<text x="562" y="389" class="small">Control read and bus direction; issue READY_N</text>
<text x="562" y="427" class="small">Respond to unpopulated regions as specified</text>
<text x="562" y="492" class="small">Wait for flash recovery before ROM acknowledge</text>
<rect x="1190" y="198" width="340" height="190" rx="10" class="rom"/>
<text x="1360" y="243" text-anchor="middle" class="head">Example flash ROM</text>
<text x="1360" y="281" text-anchor="middle" class="small">SST39VF6401B · 4M × 16</text>
<text x="1360" y="316" text-anchor="middle" class="small">8 MiB fitted on this card</text>
<text x="1360" y="354" text-anchor="middle" class="small">Normal console access: read-only</text>
<path d="M360 280H530" class="bus"/>
<path d="M360 407H530" class="line"/>
<path d="M530 516H360" class="line"/>
<path d="M995 260H1190" class="line"/><text x="1092" y="246" text-anchor="middle" class="small">Address / CE / OE</text>
<path d="M1190 332H995" class="line"/><text x="1092" y="365" text-anchor="middle" class="small">16-bit data</text>
<rect x="60" y="640" width="450" height="200" rx="9" class="edge"/>
<text x="85" y="684" class="head">Presence</text>
<text x="85" y="727" class="small">B25 joins cartridge ground, e.g. B26.</text>
<text x="85" y="765" class="small">Presence identifies a seated card,</text>
<text x="85" y="795" class="small">not its capacity or bootability.</text>
<rect x="535" y="640" width="485" height="200" rx="9" class="part"/>
<text x="560" y="684" class="head">Power and reset</text>
<text x="560" y="727" class="small">3.3 V → local power-on reset</text>
<text x="560" y="765" class="small">Power-on reset → controller and flash RST#</text>
<text x="560" y="803" class="small">CART_RESET_N → controller logical reset</text>
<rect x="1045" y="640" width="485" height="200" rx="9" class="rom"/>
<text x="1070" y="684" class="head">Flash protection and recovery</text>
<text x="1070" y="727" class="small">WE# inactive during console operation</text>
<text x="1070" y="765" class="small">WP# does not protect all blocks</text>
<text x="1070" y="803" class="small">Controller waits for flash reset recovery</text>
<text x="60" y="918" class="note">This example uses 3.3 V and ground; V5 is unused. It has no card RAM, mailbox, IRQ or DMA requests.</text>
<text x="60" y="956" class="note">The console selects a socket; the card owns its fitted ROM capacity and response to unpopulated locations.</text>
<text x="60" y="994" class="note">The supervisor, flash programming, reset timing and card layout remain to be designed and qualified.</text>
</svg>
