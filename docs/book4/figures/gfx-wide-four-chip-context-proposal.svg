<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
<title id="title">Wide video memory in the four-device console: qualitative proposal</title>
<desc id="desc">A qualitative grouping, not a physical placement or scale drawing. CORE and GFX are grouped near each other with a proposed shared passive spreader; the APU and firmware bridge remain elsewhere on the board. GFX and INPUT use a proposed shared memory service connecting four video SRAMs and the existing proposed two-device snapshot bank. Two cartridge sockets remain below the GFX group in this schematic grouping. Keyboard and four pad ports connect to INPUT. Rear video and audio connect through their respective analogue circuits. The four video SRAMs include two top and two underside positions in one explored option; their true footprints, spacings, pins, thermal and mechanical fit are not established.</desc>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#183044;font-size:19px}.title{font-size:30px;font-weight:bold}.heading{font-size:23px;font-weight:bold}.small{font-size:17px}.tiny{font-size:15px}.board{fill:#f2f7f2;stroke:#477053;stroke-width:2.5}.chip{fill:#e2edf5;stroke:#315e7d;stroke-width:2}.candidate{fill:#fff6e5;stroke:#a46d20;stroke-width:2;stroke-dasharray:8 5}.system{fill:#f3f5f6;stroke:#6a7b84;stroke-width:2}.cooler{fill:none;stroke:#579cb0;stroke-width:4;stroke-dasharray:12 7}.logical{fill:none;stroke:#315e7d;stroke-width:3}.note{fill:#fafbfc;stroke:#bec9ce;stroke-width:1.5}.rule{stroke:#c6d1d5;stroke-width:1.5}
</style>
</defs>
<rect width="1600" height="1030" fill="white"/>
