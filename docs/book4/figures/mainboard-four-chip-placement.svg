<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Mainboard: four custom devices and cartridge sockets</title>
<desc id="desc">Top view of the proposed passive-cooling mainboard. U1 CORE, U2 GFX and INPUT, U4 APU, U7 firmware bridge, and the two cartridge sockets are identified. Case slot 1 is controller socket 0; case slot 2 is controller socket 1. The view shows placement, not routing or a finished board.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183044;font-size:24px;font-weight:600}.sub{font-size:18px;font-weight:400}.label{fill:#fff;fill-opacity:.96;stroke:#627e8c;stroke-width:1.5}.leader{fill:none;stroke:#183f5b;stroke-width:3}.target{fill:#fff;stroke:#183f5b;stroke-width:3}</style></defs>
<image x="0" y="0" width="1800" height="1200" xlink:href="motherboard-passive-candidate-top.png"/>
<rect class="label" x="65" y="290" width="275" height="78" rx="9"/><text x="84" y="322">U7 · Firmware bridge</text><text class="sub" x="84" y="349">System ROM access</text>
<path class="leader" d="M340 329 H390 L574 458"/><circle class="target" cx="574" cy="458" r="6"/>
<rect class="label" x="65" y="560" width="275" height="78" rx="9"/><text x="84" y="592">U1 · CORE</text><text class="sub" x="84" y="619">Processor and engines</text>
<path class="leader" d="M340 599 H490 L741 647"/><circle class="target" cx="741" cy="647" r="6"/>
<rect class="label" x="650" y="108" width="285" height="78" rx="9"/><text x="669" y="140">U4 · APU</text><text class="sub" x="669" y="167">Audio and sample playback</text>
<path class="leader" d="M792 186 V268 L795 444"/><circle class="target" cx="795" cy="444" r="6"/>
<rect class="label" x="1450" y="624" width="285" height="78" rx="9"/><text x="1469" y="656">U2 · GFX</text><text class="sub" x="1469" y="683">Graphics, video and INPUT</text>
<path class="leader" d="M1450 663 H1380 L1081 650"/><circle class="target" cx="1081" cy="650" r="6"/>
<rect class="label" x="1410" y="338" width="340" height="104" rx="9"/><text x="1429" y="370">Cartridge sockets</text><text class="sub" x="1429" y="396">Case slot 1 = controller socket 0</text><text class="sub" x="1429" y="422">Case slot 2 = controller socket 1</text>
<path class="leader" d="M1410 377 H1390 L1328 429 M1390 377 V503 L1328 556"/><circle class="target" cx="1328" cy="429" r="6"/><circle class="target" cx="1328" cy="556" r="6"/>
<text class="sub" x="900" y="1087" text-anchor="middle">Placement candidate; the board is not fully routed and the proposed INPUT/GFX integration is not yet implemented.</text>
</svg>
