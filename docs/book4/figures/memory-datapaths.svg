<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1000" role="img" aria-labelledby="title desc">
<title id="title">CORE memory paths and separate retained I/O storage</title>
<desc id="desc">CPU and DMA use mapped word requests. GEO reads ROM, raw main RAM and cartridge data. The CORE router accepts a per-request access class for mapped summary writes; the GEO producer is not yet connected. Each target retains its response owner, allowing independent paths to run concurrently. Admission can retain a DMA block. Separate retained I/O storage does not alias underlying DRAM. The DRAM controller maintains refresh during system reset; power-on reset initializes its waveform engine.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#294b68"/></marker>
 <style>text{font-family:Arial,sans-serif;fill:#183044;font-size:20px}.title{font-size:26px;font-weight:bold}.minor{font-size:18px}.chip{fill:#f5f7f8;stroke:#294b68;stroke-width:2}.block{fill:#e1edf4;stroke:#294b68;stroke-width:2}.port{fill:white;stroke:#667d8c;stroke-width:2;stroke-dasharray:7 4}.line{fill:none;stroke:#294b68;stroke-width:3;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style>
</defs>
