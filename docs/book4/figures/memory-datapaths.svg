<text x="887" y="780" text-anchor="middle" class="minor">Full cartridge byte address and access flags</text>
<path d="M625,440 H550 V455 H265 V700 H460 V720" class="line"/>
<path d="M710,440 V480 H680 V690 H887 V720" class="line"/>
<text x="275" y="850" class="minor">GEO supplies access class per request; mapped summary producer is not yet connected.</text>
<text x="275" y="888">System RESET: clear retained I/O; finish legal DRAM cycles and continue refresh.</text>
<text x="275" y="926">Internal power-on reset: initialise DRAM timing, then 200 µs and eight CBR cycles.</text>
<text x="275" y="965" class="minor">Dashed blocks identify the interfaces to local control units and cartridge decoding.</text>
</svg>
