<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1260" role="img" aria-labelledby="title desc">
<title id="title">U1 CORE system ASIC: separate execution, arithmetic and transfer engines</title>
<desc id="desc">The U1 functional organisation includes CPU execution and runtime services, register-fed GTE, memory-addressed GEO, two-channel DMA and IMGDEC. GEO reads operands from main RAM, system ROM or the cartridge bus and writes ordinary results to main RAM. OVERLAP2D summary writes use the mapped bus and can also address I/O. The CPU functions can be software, microcode or dedicated logic. CPU register accesses configure the engines and read their results. CPU and GEO memory requests, DMA transfers and IMGDEC data-port accesses meet at the internal memory and port arbiter. Separate controllers connect the existing main DRAM, cartridge CAD bus and shared system bus. The CPU constructs GPU packets; GTE does not submit them.</desc>
<defs>
