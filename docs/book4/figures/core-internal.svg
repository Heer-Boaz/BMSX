 <style>
 text{font-family:Arial,sans-serif;fill:#183044;font-size:20px}
 .boundary{fill:#fbfcfd;stroke:#294b68;stroke-width:3}
 .block{fill:#e1edf4;stroke:#294b68;stroke-width:2.5}
 .store{fill:#f5f7f8;stroke:#294b68;stroke-width:2}
 .note{fill:#fff;stroke:#b5c4ce;stroke-width:1.5}
 .data{fill:none;stroke:#294b68;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}
 .control{fill:none;stroke:#294b68;stroke-width:2;stroke-dasharray:7 5;marker-start:url(#arrow);marker-end:url(#arrow)}
 .spine{fill:none;stroke:#294b68;stroke-width:2;stroke-dasharray:7 5}
 .title{font-size:28px;font-weight:bold}.heading{font-size:23px;font-weight:bold}
 .minor{font-size:18px}.small{font-size:17px}
 </style>
</defs>
