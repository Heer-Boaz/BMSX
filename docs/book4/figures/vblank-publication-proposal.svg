<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 790" role="img" aria-labelledby="title description">
<title id="title">VBlank event and input-publication ordering</title>
<desc id="description">The present wiring sends a GFX VBlank toggle in parallel to U7 INPUT and U1 CORE. These independent paths do not establish whether input publication precedes the VBlank interrupt. A not-yet-implemented alternative orders VBlank events and INPUT control writes together before publication and subsequent IRQ delivery. Sampling, physical transport and event rates remain open.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#324d63"/></marker>
  <style>
    text{font-family:DejaVu Sans,sans-serif;font-size:22px;fill:#203747}
    .heading{font-size:30px;font-weight:700}.title{font-size:23px;font-weight:700}
    .small{font-size:19px;fill:#395567}.panel{fill:#f6f8fa;stroke:#a4b3bd;stroke-width:2}
    .owner{fill:#e5eff6;stroke:#486b82;stroke-width:2}.input{fill:#e8f4ef;stroke:#458169;stroke-width:2}
    .proposal{fill:#fcf0d9;stroke:#a7823c;stroke-width:2}.line{fill:none;stroke:#324d63;stroke-width:3;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1500" height="790" fill="white"/>
<text x="45" y="51" class="heading">VBlank and input publication</text>

<rect x="35" y="80" width="1430" height="278" rx="12" class="panel"/>
<text x="60" y="119" class="title">Current construction — parallel event paths</text>
<rect x="80" y="181" width="290" height="114" rx="8" class="owner"/>
<text x="225" y="220" text-anchor="middle" class="title">U2 GFX</text>
<text x="225" y="253" text-anchor="middle" class="small">VBlank event toggle</text>
<rect x="575" y="137" width="340" height="91" rx="8" class="input"/>
<text x="745" y="173" text-anchor="middle" class="title">U7 INPUT</text>
<text x="745" y="202" text-anchor="middle" class="small">Capture if armed</text>
<rect x="575" y="249" width="340" height="91" rx="8" class="owner"/>
<text x="745" y="285" text-anchor="middle" class="title">U1 CORE</text>
<text x="745" y="314" text-anchor="middle" class="small">VBlank interrupt pending</text>
<path d="M370 212H465V182H575" class="line"/>
<path d="M370 264H465V294H575" class="line"/>
<text x="980" y="198" class="small">Independent receivers:</text>
<text x="980" y="228" class="small">no publication-before-IRQ</text>
<text x="980" y="258" class="small">ordering is established.</text>

<rect x="35" y="382" width="1430" height="278" rx="12" class="panel"/>
<text x="60" y="421" class="title">Proposed construction — ordered event path, not implemented</text>
<rect x="70" y="490" width="235" height="100" rx="8" class="owner"/>
<text x="187" y="529" text-anchor="middle" class="title">U2 GFX</text>
<text x="187" y="558" text-anchor="middle" class="small">VBlank event</text>
<rect x="355" y="490" width="275" height="100" rx="8" class="proposal"/>
<text x="492" y="529" text-anchor="middle" class="title">Ordering owner</text>
<text x="492" y="558" text-anchor="middle" class="small">Event and control writes</text>
<text x="492" y="457" text-anchor="middle" class="small">ARM / RESET writes</text>
<path d="M492 464V490" class="line"/>
<rect x="680" y="490" width="325" height="100" rx="8" class="input"/>
<text x="842" y="529" text-anchor="middle" class="title">U7 INPUT</text>
<text x="842" y="558" text-anchor="middle" class="small">Process event / publish</text>
<rect x="1065" y="490" width="345" height="100" rx="8" class="owner"/>
<text x="1237" y="529" text-anchor="middle" class="title">U1 CORE</text>
<text x="1237" y="558" text-anchor="middle" class="small">VBlank interrupt pending</text>
<path d="M305 540H355" class="line"/>
<path d="M630 540H680" class="line"/>
<path d="M1005 540H1065" class="line"/>
<text x="80" y="637" class="small">Unarmed events still reach IRQ; INPUT RESET overrides a coincident capture.</text>

<text x="60" y="711" class="small">Ordering implementation, live-input sampling, event rate, reset and delivery remain to be designed.</text>
<text x="60" y="743" class="small">Arrows describe ordering, not exact timing, pin assignments or a completed implementation.</text>
</svg>
