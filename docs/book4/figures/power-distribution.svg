<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 960" role="img" aria-labelledby="title desc">
<title id="title">BMSX power entry, enable and reset</title>
<desc id="desc">Nine-volt centre-positive input passes F60 and U62 to VIN9. VIN9 feeds two buck converters and a control regulator. Power-good and the front switch determine buck enable. The 3.3 V and 5 V rails feed both internal circuits and connector supplies. A separate supervisor observes the main rails and drives reset.</desc>
<defs>
 <marker id="powerarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#934a35"/></marker>
 <marker id="controlarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#285b83"/></marker>
 <style>text{font-family:Arial,sans-serif;fill:#183044;font-size:20px}.box{fill:#f5f7f8;stroke:#294b68;stroke-width:2}.controlbox{fill:#e3eef5;stroke:#285b83;stroke-width:2}.power{fill:none;stroke:#934a35;stroke-width:4;marker-end:url(#powerarrow)}.supply{fill:none;stroke:#934a35;stroke-width:4}.control{fill:none;stroke:#285b83;stroke-width:2.5;marker-end:url(#controlarrow)}.title{font-size:24px;font-weight:bold}.minor{font-size:17px}.label{font-size:19px}</style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="40" y="50" width="260" height="110" rx="8" class="box"/><text x="170" y="86" text-anchor="middle" class="title">Rear input / J61</text><text x="170" y="119" text-anchor="middle">9 V DC, centre-positive</text><text x="170" y="146" text-anchor="middle" class="minor">RAW9 and GND</text>
<rect x="370" y="50" width="200" height="110" rx="8" class="box"/><text x="470" y="88" text-anchor="middle" class="title">F60</text><text x="470" y="123" text-anchor="middle">5 A fuse</text><path d="M300,105 H370" class="power"/>
<rect x="650" y="50" width="300" height="110" rx="8" class="box"/><text x="800" y="86" text-anchor="middle" class="title">U62 TPS259474L</text><text x="800" y="119" text-anchor="middle">Protected input switch</text><text x="800" y="146" text-anchor="middle" class="minor">Ramp / voltage / breaker control</text><path d="M570,105 H650" class="power"/><text x="610" y="85" text-anchor="middle" class="minor">FUSED9</text>
<path d="M950,105 H1130 V245 H210 V340 M640,245 V340 M1070,245 V340" class="supply"/><text x="1150" y="112" class="title">VIN9</text><circle cx="640" cy="245" r="6" fill="#934a35"/><circle cx="1070" cy="245" r="6" fill="#934a35"/>
<rect x="80" y="340" width="260" height="110" rx="8" class="box"/><text x="210" y="377" text-anchor="middle" class="title">U20 TPS56637</text><text x="210" y="411" text-anchor="middle">L1 · 2.2 µH</text><path d="M210,450 V500" class="power"/><text x="210" y="534" text-anchor="middle" class="title">V3V3</text><text x="210" y="563" text-anchor="middle" class="minor">Devices, memory, cartridges, pads</text>
<rect x="510" y="340" width="260" height="110" rx="8" class="box"/><text x="640" y="377" text-anchor="middle" class="title">U21 TPS56637</text><text x="640" y="411" text-anchor="middle">L2 · 3.3 µH</text><path d="M640,450 V500" class="power"/><text x="640" y="534" text-anchor="middle" class="title">V5</text><text x="640" y="563" text-anchor="middle" class="minor">Analogue, cartridges, pads, keyboard</text>
<rect x="940" y="340" width="260" height="110" rx="8" class="box"/><text x="1070" y="377" text-anchor="middle" class="title">U63 TLV70433</text><text x="1070" y="411" text-anchor="middle">Control-domain regulator</text><path d="M1070,450 V500" class="power"/><text x="1070" y="534" text-anchor="middle" class="title">VCTRL3V3</text><path d="M1070,551 V640" class="power"/>
<rect x="940" y="640" width="260" height="110" rx="8" class="controlbox"/><text x="1070" y="678" text-anchor="middle" class="title">U64 TLV7031</text><text x="1070" y="712" text-anchor="middle">PG and RUN qualification</text>
<path d="M800,160 V195 H1320 V695 H1200" class="control"/><text x="1295" y="600" text-anchor="end" class="label">EFUSE_PG</text>
<path d="M940,695 H40 V395 H80" class="control"/><path d="M470,695 V395 H510" class="control"/><circle cx="470" cy="695" r="4" fill="#285b83"/><text x="600" y="675" text-anchor="middle" class="title">BUCK_EN</text><text x="600" y="721" text-anchor="middle" class="minor">Both buck converters; default low</text>
<rect x="940" y="820" width="260" height="90" rx="8" class="controlbox"/><text x="1070" y="856" text-anchor="middle" class="title">Front POWER</text><text x="1070" y="881" text-anchor="middle" class="minor">RUN closes POWER_SW</text><text x="1070" y="902" text-anchor="middle" class="minor">to GND</text><path d="M1070,820 V750" class="control"/>
<rect x="80" y="805" width="690" height="115" rx="8" class="controlbox"/><text x="105" y="844" class="title">U60 LTC1326 — separate reset supervision</text><text x="105" y="876">Inputs: V3V3, V5 and divided VIN9</text><text x="105" y="905" class="minor">RESET_N → CORE / GFX / APU / I/O; local clock-domain release</text>
<text x="40" y="28" class="minor">Supply paths in brown; enable and sense relationships in blue. This is a distribution diagram, not a routing drawing.</text>
</svg>
