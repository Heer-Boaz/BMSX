<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="selection-title selection-desc">
  <title id="selection-title">One data address, two cartridge sockets</title>
  <desc id="selection-desc">Both panels show an ordinary CPU word read at address 30000010H. With SELECT zero, the read returns example value 11111111H from socket zero RAM. With SELECT one, the same address returns example value 22222222H from socket one RAM. The program's instruction-fetch selection remains socket zero in both panels.</desc>
  <defs>
    <marker id="selection-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker>
  </defs>
  <g fill="#fff" stroke="#111" stroke-width="1.5">
    <rect x="10" y="10" width="480" height="370"/>
    <rect x="510" y="10" width="480" height="370"/>
    <rect x="125" y="70" width="250" height="65"/>
    <rect x="625" y="70" width="250" height="65"/>
    <rect x="35" y="210" width="200" height="100"/>
    <rect x="265" y="210" width="200" height="100"/>
    <rect x="535" y="210" width="200" height="100"/>
    <rect x="765" y="210" width="200" height="100"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#selection-arrow)">
    <path d="M250 135 V170 H135 V210"/>
    <path d="M750 135 V170 H865 V210"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="21" text-anchor="middle">
    <text x="250" y="43" font-weight="bold">SELECT = 0</text>
    <text x="750" y="43" font-weight="bold">SELECT = 1</text>
    <text x="250" y="96">CPU data read</text>
    <text x="250" y="122" font-family="monospace">30000010H</text>
    <text x="750" y="96">CPU data read</text>
    <text x="750" y="122" font-family="monospace">30000010H</text>
    <text x="135" y="238" font-weight="bold">Socket 0 RAM</text>
    <text x="135" y="269">Byte offset 16</text>
    <text x="135" y="296" font-family="monospace">11111111H</text>
    <text x="365" y="238">Socket 1 RAM</text>
    <text x="365" y="269">Byte offset 16</text>
    <text x="365" y="296" font-family="monospace">22222222H</text>
    <text x="635" y="238">Socket 0 RAM</text>
    <text x="635" y="269">Byte offset 16</text>
    <text x="635" y="296" font-family="monospace">11111111H</text>
    <text x="865" y="238" font-weight="bold">Socket 1 RAM</text>
    <text x="865" y="269">Byte offset 16</text>
    <text x="865" y="296" font-family="monospace">22222222H</text>
    <text x="250" y="350">Instruction fetch: socket 0</text>
    <text x="750" y="350">Instruction fetch: socket 0</text>
  </g>
</svg>
