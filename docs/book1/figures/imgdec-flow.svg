<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="imgdec-flow-title imgdec-flow-desc">
  <title id="imgdec-flow-title">IMGDEC stream and generated-header paths</title>
  <desc id="imgdec-flow-desc">CPU or DMA writes feed the input FIFO. The token decoder uses payload history and supplies payload words to the output FIFO. Destination and size registers supply separately generated GPU upload headers. CPU or DMA drains the combined word stream; GPU and graphics memory are downstream, not an IMGDEC memory destination.</desc>
  <defs><marker id="imgdec-flow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker></defs>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="15" y="205" width="175" height="100"/>
    <rect x="280" y="205" width="155" height="100"/>
    <rect x="520" y="205" width="205" height="100"/>
    <rect x="815" y="205" width="165" height="100"/>
    <rect x="15" y="30" width="355" height="90"/>
    <rect x="520" y="30" width="205" height="90"/>
    <rect x="505" y="385" width="235" height="70"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#imgdec-flow-arrow)">
    <path d="M190 255 H280"/>
    <path d="M435 255 H520"/>
    <path d="M725 255 H815"/>
    <path d="M370 75 H520"/>
    <path d="M622 205 V120" stroke-dasharray="6 5"/>
    <path d="M725 75 H895 V205"/>
    <path d="M595 305 V385"/>
    <path d="M650 385 V305"/>
    <path d="M895 305 V350 H980"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="102" y="241">CPU or DMA</text><text x="102" y="273">DATA writes</text>
    <text x="235" y="238" font-size="19">Words</text>
    <text x="357" y="241">Input FIFO</text><text x="357" y="273">32 words</text>
    <text x="622" y="241">Stream decoder</text><text x="622" y="273">Payload words</text>
    <text x="770" y="238" font-size="19">Payload</text>
    <text x="897" y="241">Output FIFO</text><text x="897" y="273">64 words</text>
    <text x="192" y="65">Texture destination and size</text><text x="192" y="97">CLUT destination</text>
    <text x="622" y="65">Upload-header</text><text x="622" y="97">generator</text>
    <text x="825" y="59" font-size="19">Header words</text>
    <text x="695" y="166" font-size="19">Header stage</text>
    <text x="622" y="415">Payload history</text><text x="622" y="443">4096 words</text>
    <text x="880" y="385" font-size="19">DATA reads</text><text x="880" y="414" font-size="19">CPU or DMA</text>
    <text x="305" y="443" font-size="19">History excludes generated headers.</text>
  </g>
</svg>
