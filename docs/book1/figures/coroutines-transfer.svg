<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="transfer-title transfer-desc">
  <title id="transfer-title">Argument and result transfers in the producer example</title>
  <desc id="transfer-desc">The parent resumes the producer with 10 and 3. The producer yields 13, nil and ready; the parent's resume returns true followed by those values. The producer is suspended. The next resume supplies 17, nil and 23 as the results of the suspended yield call. The producer returns 40, nil and 3; the parent's resume returns true followed by those results, and the producer is dead. Vertical distance does not represent elapsed time.</desc>
  <defs>
    <marker id="transfer-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker>
  </defs>
  <g fill="#111" font-family="sans-serif" font-size="25" text-anchor="middle">
    <text x="160" y="35">Parent</text>
    <text x="840" y="35">Producer</text>
  </g>
  <g fill="none" stroke="#777" stroke-width="2" stroke-dasharray="7 7">
    <path d="M160 55 V500"/>
    <path d="M840 55 V500"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#transfer-arrow)">
    <path d="M160 105 H840"/>
    <path d="M840 205 H160"/>
    <path d="M160 325 H840"/>
    <path d="M840 425 H160"/>
  </g>
  <g fill="#111" font-family="monospace" font-size="22" text-anchor="middle">
    <text x="500" y="90">resume(producer, 10, 3)</text>
    <text x="500" y="190">yield(13, nil, 'ready')</text>
    <text x="500" y="310">resume(producer, 17, nil, 23)</text>
    <text x="500" y="410">return 40, nil, 3</text>
  </g>
  <g fill="#fff">
    <rect x="20" y="223" width="370" height="30"/>
    <rect x="745" y="223" width="170" height="30"/>
    <rect x="630" y="343" width="365" height="30"/>
    <rect x="20" y="443" width="330" height="30"/>
    <rect x="805" y="443" width="100" height="30"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="21">
    <text x="30" y="245">Receives true, 13, nil, 'ready'</text>
    <text x="755" y="245">Suspended</text>
    <text x="640" y="365">yield returns 17, nil, 23</text>
    <text x="30" y="465">Receives true, 40, nil, 3</text>
    <text x="815" y="465">Dead</text>
    <text x="500" y="525" text-anchor="middle">Language control transfer; not an elapsed-time scale.</text>
  </g>
</svg>
