<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" role="img" aria-labelledby="console-system-title console-system-desc">
  <title id="console-system-title">BMSX program control and storage paths</title>
  <desc id="console-system-desc">The CPU reads system or cartridge ROM and accesses main RAM. GTE exchanges register operands and results with the CPU; GEO processes addressed memory records. DMA moves mapped words between storage and unit ports. The GPU writes its local memory, which PCRTC reads for video. APU transfer ports reach private sample RAM, from which playback produces stereo output; ROM can also supply playback. Dashed arrows denote CPU programming and observation. Solid arrows denote data access, not electrical buses. Software constructs GPU commands from geometry results.</desc>
  <defs>
    <marker id="console-system-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker>
  </defs>
  <g fill="#f3f3f3" stroke="#777" stroke-width="1.5">
