<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" role="img" aria-labelledby="dma-title dma-desc">
  <title id="dma-title">DMA configuration and transfer paths</title>
  <desc id="dma-desc">Two programmed channel banks and their request gates select one block. It captures configuration, not source payload. Mapped source reads supply successive mapped destination writes. At block completion, the resulting addresses and remaining count are written back to that channel.</desc>
  <defs><marker id="dma-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker></defs>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="15" y="25" width="225" height="65"/>
    <rect x="15" y="125" width="225" height="65"/>
    <rect x="310" y="55" width="235" height="110"/>
    <rect x="625" y="55" width="350" height="110"/>
    <rect x="15" y="300" width="225" height="75"/>
    <rect x="385" y="290" width="260" height="95"/>
    <rect x="770" y="300" width="205" height="75"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#dma-arrow)">
    <path d="M240 57 H275 V85 H310"/>
    <path d="M240 157 H275 V135 H310"/>
    <path d="M545 110 H625"/>
    <path d="M800 165 V235 H515 V290"/>
    <path d="M240 337 H385"/>
    <path d="M645 337 H770"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="127" y="53">Channel 0</text><text x="127" y="79">programmed words</text>
    <text x="127" y="153">Channel 1</text><text x="127" y="179">programmed words</text>
    <text x="427" y="87">Both request gates</text><text x="427" y="116">+ block selection</text><text x="427" y="145">among eligible channels</text>
    <text x="800" y="87">One block in progress</text><text x="800" y="117">Addresses, count, CONTROL</text><text x="800" y="146">Block length and duration</text>
    <text x="127" y="331">Mapped source</text><text x="127" y="359">live payload</text>
    <text x="515" y="318">Word transfers</text><text x="515" y="347">Read, then write</text><text x="515" y="375">for each word</text>
    <text x="872" y="331">Mapped</text><text x="872" y="359">destination</text>
    <text x="690" y="222" font-size="19">Captured configuration</text>
    <text x="15" y="410" text-anchor="start" font-size="19">At block completion: address/count writeback to that channel only; CONTROL is unchanged.</text>
  </g>
</svg>
