<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 575" role="img" aria-labelledby="gte-proj-title gte-proj-desc">
  <title id="gte-proj-title">Screen coordinates of the worked triangle</title>
  <desc id="gte-proj-desc">A 256 by 192 screen-coordinate area contains a triangle at V0 96,64; V1 160,64; and V2 128,128. Its projected zero position is 128,96, set by OFX and OFY. Dimension lines measure the offsets from screen coordinate zero. Increasing SX is right and increasing SY is down in this drawing. These are the worked sequence's coordinates, not a GTE clipping window.</desc>
  <defs>
    <marker id="gte-proj-arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 8 4 L 0 0 L 0 8 Z" fill="#111"/></marker>
  </defs>
  <g fill="#111" font-family="sans-serif" font-size="16">
    <text x="30" y="29" font-size="20" font-weight="bold">Worked triangle after projection</text>
    <text x="238" y="67" text-anchor="middle">128 = OFX / 65536</text>
    <text x="58" y="201" text-anchor="middle" transform="rotate(-90 58 201)">96 = OFY / 65536</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1">
    <rect x="110" y="105" width="512" height="384"/>
    <path d="M 110 105 H 653" marker-end="url(#gte-proj-arrow)"/>
    <path d="M 110 105 V 515" marker-end="url(#gte-proj-arrow)"/>
    <path d="M 110 80 H 366" marker-start="url(#gte-proj-arrow)" marker-end="url(#gte-proj-arrow)"/>
    <path d="M 75 105 V 297" marker-start="url(#gte-proj-arrow)" marker-end="url(#gte-proj-arrow)"/>
    <path d="M 110 75 V 105 M 366 75 V 297 M 70 105 H 110 M 70 297 H 366" stroke-dasharray="4 5"/>
    <path d="M 302 233 L 430 233 L 366 361 Z" stroke-width="2.5"/>
    <path d="M 290 217 L 302 233 M 442 217 L 430 233 M 374 297 H 436"/>
  </g>
  <g fill="#fff" stroke="#111" stroke-width="1.5">
    <circle cx="302" cy="233" r="4"/>
    <circle cx="430" cy="233" r="4"/>
    <circle cx="366" cy="361" r="4"/>
  </g>
  <path d="M 359 297 H 373 M 366 290 V 304" fill="none" stroke="#111" stroke-width="2"/>
  <g fill="#111" font-family="sans-serif" font-size="16">
    <text x="664" y="111">+SX</text>
    <text x="94" y="539">+SY</text>
    <text x="122" y="128">(0,0)</text>
    <text x="290" y="207" text-anchor="end">V0 (96,64)</text>
    <text x="442" y="207">V1 (160,64)</text>
    <text x="366" y="391" text-anchor="middle">V2 (128,128)</text>
    <text x="446" y="298">Projected (0,0)</text>
    <text x="446" y="320">at (128,96)</text>
    <text x="608" y="474" text-anchor="end">256 × 192 coordinate area</text>
    <text x="160" y="548">H = 256; depth = 512; q = 32768 = ½ × 65536</text>
  </g>
</svg>
