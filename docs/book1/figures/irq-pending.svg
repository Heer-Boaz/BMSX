<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" role="img" aria-labelledby="irq-title irq-desc">
  <title id="irq-title">Pending, acknowledge and delivery mask</title>
  <desc id="irq-desc">A source request sets bits in the pending word. A separate acknowledge input clears selected pending bits. Reading FLAGS obtains the full pending word. The pending word and retained MASK feed an AND operation; a nonzero result asserts the controller output. The diagram does not include the CPU interrupt-enable gate.</desc>
  <defs>
    <marker id="irq-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker>
  </defs>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="20" y="110" width="150" height="70"/>
    <rect x="240" y="110" width="190" height="70"/>
    <rect x="240" y="10" width="190" height="55"/>
    <rect x="240" y="275" width="190" height="65"/>
    <rect x="525" y="110" width="165" height="70"/>
    <rect x="525" y="275" width="165" height="65"/>
    <rect x="770" y="110" width="210" height="70"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#irq-arrow)">
    <path d="M170 145 H240"/>
    <path d="M335 110 V65"/>
    <path d="M335 275 V180"/>
    <path d="M430 145 H525"/>
    <path d="M607 275 V180"/>
    <path d="M690 145 H770"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="95" y="138">Source</text><text x="95" y="164">request R</text>
    <text x="335" y="138">Pending P</text><text x="335" y="164">latched word</text>
    <text x="335" y="45">FLAGS read</text>
    <text x="335" y="303">ACK write A</text><text x="335" y="329">clear selection</text>
    <text x="607" y="138">AND</text><text x="607" y="164">P AND M</text>
    <text x="607" y="303">MASK M</text><text x="607" y="329">retained word</text>
    <text x="875" y="138">Output asserted</text><text x="875" y="164">when nonzero</text>
    <text x="374" y="94" text-anchor="start" font-size="19">full P</text>
    <text x="350" y="235" text-anchor="start" font-size="19">ones clear</text>
    <text x="622" y="235" text-anchor="start" font-size="19">enables</text>
  </g>
</svg>
