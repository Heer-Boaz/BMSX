<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="timing-title timing-desc">
  <title id="timing-title">Reset beam landmarks</title>
  <desc id="timing-desc">A schematic, not-to-scale half-line timeline. Beam start is zero. The first HSync point is two, followed by four and later points. Active display spans zero through the boundary at 576. VBlank-active spans 576 through field end at 628. VSync and VSINT occur at 585. Field end returns to half-line zero. This is not a waveform or a presentation-latch diagram.</desc>
  <rect width="760" height="210" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="1.4">
    <path d="M 70 65 H 310 M 360 65 H 690 M 322 71 L 334 59 M 337 71 L 349 59"/>
    <path d="M 70 57 V 73 M 155 57 V 73 M 240 57 V 73 M 450 57 V 73 M 565 57 V 73 M 690 57 V 73"/>
    <path d="M 70 143 H 450 M 70 137 V 149 M 450 137 V 149"/>
    <path d="M 450 183 H 690 M 450 177 V 189 M 690 177 V 189"/>
  </g>
  <g fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="16">
    <text x="24" y="23">Half-line</text>
    <text x="736" y="23" text-anchor="end">Not to scale</text>
    <g text-anchor="middle">
      <text x="70" y="48">0</text>
      <text x="155" y="48">2</text>
      <text x="240" y="48">4</text>
      <text x="335" y="48">…</text>
      <text x="450" y="48">576</text>
      <text x="565" y="48">585</text>
      <text x="690" y="48">628</text>
      <text x="70" y="95">Beam start</text>
      <text x="155" y="95">HSync</text>
      <text x="240" y="95">HSync</text>
      <text x="450" y="95">VBlank begin</text>
      <text x="565" y="95">VSync</text>
      <text x="565" y="115">VSINT</text>
      <text x="690" y="95">Field end</text>
      <text x="690" y="115">Return to 0</text>
      <text x="260" y="133">Active-display interval</text>
      <text x="570" y="173">VBlank-active</text>
    </g>
  </g>
</svg>
