<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="console-video-title console-video-desc">
  <title id="console-video-title">GPU drawing storage and PCRTC reading</title>
  <desc id="console-video-desc">A selected upload or drawing route supplies GPU port words by CPU stores or DMA. GPU operations write the two MiB local memory. The PCRTC reads that same local memory through two circuits and composes display output. This diagram does not show an electrical bus or a second framebuffer allocation.</desc>
  <defs><marker id="console-video-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker></defs>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="10" y="25" width="190" height="90"/>
    <rect x="270" y="25" width="190" height="90"/>
    <rect x="530" y="25" width="180" height="90"/>
    <rect x="780" y="25" width="210" height="90"/>
    <rect x="780" y="230" width="210" height="100"/>
    <rect x="530" y="240" width="180" height="80"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#console-video-arrow)">
    <path id="console-source-to-transport" d="M200 70 H270"/>
    <path id="console-transport-to-gpu" d="M460 70 H530"/>
    <path id="console-gpu-to-local-memory" d="M710 70 H780"/>
    <path id="console-local-memory-to-pcrtc" d="M970 115 V230"/>
    <path id="console-pcrtc-to-output" d="M780 280 H710"/>
  </g>
  <g fill="#111" font-size="23" text-anchor="middle">
    <text x="105" y="64">RAM / ROM</text><text x="105" y="94">source data</text>
    <text x="365" y="64">CPU / DMA</text><text x="365" y="94">word supply</text>
    <text x="620" y="64">GPU</text><text x="620" y="94">GP0 port</text>
    <text x="885" y="64">GPU local memory</text><text x="885" y="94">2 MiB</text>
    <text x="885" y="263">PCRTC</text><text x="885" y="292">Two reading circuits</text><text x="885" y="318" font-size="19">and output composition</text>
    <text x="620" y="274">Display</text><text x="620" y="303">output</text>
    <text x="855" y="158" font-size="19">Read selected</text><text x="855" y="184" font-size="19">source windows</text>
    <text x="745" y="48" font-size="17">Writes</text>
    <text x="745" y="260" font-size="17">Pixels</text>
    <text x="10" y="158" text-anchor="start" font-size="20">Drawing and scanout share this storage.</text>
    <text x="10" y="186" text-anchor="start" font-size="20">A second reading circuit is not a second memory.</text>
  </g>
</svg>
