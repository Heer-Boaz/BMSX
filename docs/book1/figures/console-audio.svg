<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="console-audio-title console-audio-desc">
  <title id="console-audio-title">Audio source and private sample-memory paths</title>
  <desc id="console-audio-desc">APU slots read ROM or private sample RAM during playback, then produce left and right output frames. Ordinary main RAM is not a playback source. A separate CPU or DMA transfer-port route copies data into private sample RAM; this is not CPU-linear mapped sample storage or a playback-payload capture.</desc>
  <defs><marker id="console-audio-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker></defs>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="10" y="20" width="210" height="90"/>
    <rect x="350" y="20" width="270" height="90"/>
    <rect x="750" y="20" width="240" height="90"/>
    <rect x="10" y="240" width="210" height="100"/>
    <rect x="350" y="240" width="270" height="100"/>
    <rect x="750" y="240" width="240" height="100"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#console-audio-arrow)">
    <path id="console-rom-to-apu" d="M220 65 H350"/>
    <path id="console-apu-to-output" d="M620 65 H750"/>
    <path id="console-source-to-apu-transfer" d="M220 290 H350"/>
    <path id="console-apu-transfer-to-private-ram" d="M620 290 H750"/>
    <path id="console-private-ram-to-apu" d="M870 240 V170 H485 V110"/>
  </g>
  <g fill="#111" font-size="23" text-anchor="middle">
    <text x="115" y="59">ROM source</text><text x="115" y="89" font-size="20">Bound while playing</text>
    <text x="485" y="59">APU: 16 slots</text><text x="485" y="89" font-size="20">Playback / square generation</text>
    <text x="870" y="53">Left / right output</text><text x="870" y="80" font-size="20">44,100 stereo frames/s</text><text x="870" y="103" font-size="18">Signed 16-bit components</text>
    <text x="115" y="280">Main RAM / ROM</text><text x="115" y="312">upload source</text>
    <text x="485" y="272">CPU / DMA</text><text x="485" y="302">APU transfer port</text><text x="485" y="328" font-size="20">32-bit transport words</text>
    <text x="870" y="272">Private sample RAM</text><text x="870" y="302">512 KiB</text><text x="870" y="328" font-size="20">Not CPU-linear memory</text>
    <text x="682" y="153" font-size="20">Live sample reads</text>
    <text x="10" y="193" text-anchor="start" font-size="20">Transfer completion and playback are distinct.</text>
  </g>
</svg>
