<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="gte-overview-title gte-overview-desc">
  <title id="gte-overview-title">Separate normal GTE and GTE_PLUS data paths</title>
  <desc id="gte-overview-desc">Normal DATA and CONTROL operands enter geometry arithmetic independently. A normal COMMAND updates its selected DATA results and FIFOs, CONTROL FLAG, and nominal CYCLES duration during the command write. The separate PLUS operand latches feed VMAD3 arithmetic and a pending result set. The completion deadline controls publication of the PLUS result and flag latch.</desc>
  <defs>
    <marker id="gte-overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#111" stroke-width="1.8">
    <rect x="20" y="90" width="210" height="85"/>
    <rect x="20" y="205" width="210" height="65"/>
    <rect x="330" y="45" width="210" height="38"/>
    <rect x="300" y="105" width="270" height="140"/>
    <rect x="680" y="100" width="260" height="75"/>
    <rect x="680" y="195" width="260" height="55"/>
    <rect x="680" y="280" width="260" height="60"/>
    <rect x="20" y="450" width="220" height="125"/>
    <rect x="300" y="405" width="200" height="38"/>
    <rect x="300" y="475" width="200" height="75"/>
    <rect x="560" y="450" width="165" height="125"/>
    <rect x="780" y="450" width="160" height="125"/>
    <rect x="560" y="610" width="380" height="58"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#gte-overview-arrow)">
    <path d="M 230 137 H 300"/>
    <path d="M 230 237 H 300"/>
    <path d="M 435 83 V 105"/>
    <path d="M 570 137 H 680"/>
    <path d="M 570 222 H 680"/>
    <path d="M 500 245 V 310 H 680"/>
    <path d="M 240 512 H 300"/>
    <path d="M 400 443 V 475"/>
    <path d="M 500 512 H 560"/>
    <path d="M 725 512 H 780"/>
    <path d="M 860 610 V 575"/>
  </g>
  <path d="M 20 365 H 940" fill="none" stroke="#111" stroke-width="1.2"/>
  <g fill="#111" font-family="sans-serif" font-size="20" text-anchor="middle">
    <text x="20" y="28" text-anchor="start" font-size="24" font-weight="bold">Normal GTE</text>
    <text x="125" y="115" font-weight="bold">DATA operands</text>
    <text x="125" y="140" font-size="17">vectors · IR · color</text>
    <text x="125" y="165" font-size="17">FIFO operands</text>
    <text x="125" y="231" font-weight="bold">CONTROL operands</text>
    <text x="125" y="255" font-size="18">matrices · constants</text>
    <text x="435" y="71" font-weight="bold">COMMAND</text>
    <text x="435" y="148" font-weight="bold">Geometry arithmetic</text>
    <text x="435" y="179" font-size="18">transform · project · color</text>
    <text x="435" y="210" font-size="18">accumulate · limit</text>
    <text x="810" y="129" font-weight="bold">DATA results and FIFOs</text>
    <text x="810" y="154" font-size="17">as selected by COMMAND</text>
    <text x="810" y="229" font-weight="bold">CONTROL[31] FLAG</text>
    <text x="810" y="305" font-weight="bold">CYCLES</text>
    <text x="810" y="328" font-size="18">last nominal duration</text>
    <text x="20" y="310" text-anchor="start" font-size="18">Results are visible after the COMMAND write.</text>
    <text x="20" y="393" text-anchor="start" font-size="24" font-weight="bold">GTE_PLUS — independent multiply-add</text>
    <text x="130" y="478" font-weight="bold">Operand latches</text>
    <text x="130" y="506" font-size="18">ADD_XY · ADD_Z</text>
    <text x="130" y="532" font-size="18">MUL_XY · MUL_Z</text>
    <text x="130" y="558" font-size="18">SCALAR</text>
    <text x="400" y="431" font-weight="bold">PLUS COMMAND</text>
    <text x="400" y="505" font-weight="bold">VMAD3 arithmetic</text>
    <text x="400" y="532" font-size="18">three signed lanes</text>
    <text x="642.5" y="478" font-weight="bold">Pending set</text>
    <text x="642.5" y="506" font-size="18">RESULT_XY</text>
    <text x="642.5" y="532" font-size="18">RESULT_Z</text>
    <text x="642.5" y="558" font-size="18">FLAG</text>
    <text x="860" y="478" font-size="18" font-weight="bold">Published latch</text>
    <text x="860" y="506" font-size="18">RESULT_XY</text>
    <text x="860" y="532" font-size="18">RESULT_Z</text>
    <text x="860" y="558" font-size="18">FLAG</text>
    <text x="750" y="500" font-size="17">all 3</text>
    <text x="750" y="537" font-size="17">words</text>
    <text x="750" y="633" font-weight="bold">VMAD3 completion deadline</text>
    <text x="750" y="657" font-size="18">acceptance + 5 system cycles</text>
    <text x="20" y="624" text-anchor="start" font-size="19">PLUS CYCLES: busy + stored duration.</text>
    <text x="20" y="652" text-anchor="start" font-size="18">Completion clears busy; VMAD3 duration stays 5.</text>
  </g>
</svg>
