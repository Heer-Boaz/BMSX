<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="gte-plus-timing-title gte-plus-timing-desc">
  <title id="gte-plus-timing-title">VMAD3 acceptance, busy interval, and result publication</title>
  <desc id="gte-plus-timing-desc">A landmark diagram, not an electrical waveform and not to scale. An accepted VMAD3 captures its five input words. Throughout its five-system-cycle interval, the busy bit is one and the previous result and flag words remain visible. Completion makes RESULT_XY, RESULT_Z, and FLAG visible together, clears busy, and retains five in the low CYCLES bits. Input writes during busy affect later commands, not the captured operands. Result and FLAG reads at or after completion observe the new values. A further 32-bit CPU store addressed to PLUS COMMAND waits while busy; the diagram does not imply an automatic five-cycle CPU stall for the accepted command.</desc>
  <defs>
    <marker id="gte-plus-timing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/>
    </marker>
  </defs>
  <g fill="none" stroke="#111" stroke-width="1.8">
    <path d="M 180 140 H 930" marker-end="url(#gte-plus-timing-arrow)"/>
    <path d="M 180 132 V 148 M 720 132 V 148"/>
    <path d="M 180 148 V 175" marker-end="url(#gte-plus-timing-arrow)"/>
    <path d="M 720 148 V 210 H 750" marker-end="url(#gte-plus-timing-arrow)"/>
    <path d="M 180 250 V 490 M 720 250 V 490" stroke-width="1.2" stroke-dasharray="5 5"/>
  </g>
  <g fill="#fff" stroke="#111" stroke-width="1.5">
    <rect x="20" y="175" width="250" height="70"/>
    <rect x="310" y="175" width="370" height="70"/>
    <rect x="750" y="175" width="190" height="70"/>
    <rect x="180" y="275" width="540" height="50" fill="#f2f2f2"/>
    <rect x="720" y="275" width="220" height="50"/>
    <rect x="180" y="345" width="540" height="70" fill="#f2f2f2"/>
    <rect x="720" y="345" width="220" height="70"/>
    <rect x="180" y="435" width="540" height="50" fill="#f2f2f2"/>
    <rect x="720" y="435" width="220" height="50"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="20" text-anchor="middle">
    <text x="20" y="28" text-anchor="start" font-size="24" font-weight="bold">VMAD3 acceptance and publication</text>
    <text x="20" y="56" text-anchor="start" font-size="18">Timing landmarks — not an electrical waveform; not to scale.</text>
    <text x="180" y="93" font-weight="bold">Accepted VMAD3</text>
    <text x="180" y="118" font-size="18">t0</text>
    <text x="450" y="127" font-size="18">5 system cycles</text>
    <text x="720" y="93" font-weight="bold">Completion deadline</text>
    <text x="720" y="118" font-size="18">t0 + 5</text>
    <text x="930" y="163" text-anchor="end" font-size="18">time</text>
    <text x="145" y="199" font-size="18">Capture five input words;</text>
    <text x="145" y="224" font-size="18">begin operation.</text>
    <text x="495" y="199" font-size="18">Input writes are allowed while busy.</text>
    <text x="495" y="224" font-size="18">They affect a later command only.</text>
    <text x="845" y="196" font-size="17" font-weight="bold">Publish together:</text>
    <text x="845" y="217" font-size="17">RESULT_XY</text>
    <text x="845" y="238" font-size="17">RESULT_Z + FLAG</text>
    <text x="20" y="306" text-anchor="start" font-size="18">CYCLES bit 31</text>
    <text x="450" y="307">1 — busy</text>
    <text x="830" y="307">0 — idle</text>
    <text x="20" y="377" text-anchor="start" font-size="18">Visible outputs</text>
    <text x="20" y="403" text-anchor="start" font-size="17">XY · Z · FLAG</text>
    <text x="450" y="374" font-size="18">Previous RESULT_XY / RESULT_Z / FLAG</text>
    <text x="450" y="399" font-size="18">Unchanged throughout busy</text>
    <text x="830" y="374" font-size="18">New three-word set</text>
    <text x="830" y="399" font-size="18">published together</text>
    <text x="20" y="466" text-anchor="start" font-size="18">CYCLES low bits</text>
    <text x="450" y="467" font-size="18">5 — stored duration, not a countdown</text>
    <text x="830" y="467" font-size="18">5 — retained</text>
    <text x="20" y="528" text-anchor="start" font-size="18">Before the deadline, RESULT_XY / RESULT_Z / FLAG reads return the previous values.</text>
    <text x="20" y="555" text-anchor="start" font-size="18">At or after the deadline, result/FLAG reads observe the new set.</text>
    <text x="20" y="582" text-anchor="start" font-size="18">A further 32-bit CPU store addressed to PLUS COMMAND waits while busy.</text>
    <text x="20" y="609" text-anchor="start" font-size="18">Accepting VMAD3 does not impose an automatic five-cycle CPU stall.</text>
  </g>
</svg>
