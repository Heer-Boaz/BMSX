<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="window-title window-desc">
  <title id="window-title">Circuit display window</title>
  <desc id="window-desc">The circuit window begins at signal X and signal Y. Its horizontal endpoint is signal X plus horizontal extent plus one. Dimension arrows share the exact window boundaries and show horizontal extent plus one and vertical extent plus one.</desc>
  <defs>
    <marker id="window-dimension-start" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#000"/>
    </marker>
    <marker id="window-dimension-end" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#000"/>
    </marker>
  </defs>
  <rect width="760" height="250" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="1.4">
    <rect x="180" y="72" width="360" height="112"/>
    <path d="M 180 40 V 64 M 540 40 V 64 M 145 72 H 172"/>
    <path d="M 180 194 V 232 M 540 194 V 232 M 550 72 H 582 M 550 184 H 582"/>
    <path d="M 180 222 H 540" marker-start="url(#window-dimension-start)" marker-end="url(#window-dimension-end)"/>
    <path d="M 572 72 V 184" marker-start="url(#window-dimension-start)" marker-end="url(#window-dimension-end)"/>
  </g>
  <g fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="16">
    <text x="180" y="29" text-anchor="middle">signal X</text>
    <text x="540" y="29" text-anchor="middle">signal X + extent + 1</text>
    <text x="134" y="77" text-anchor="end">signal Y</text>
    <text x="360" y="134" text-anchor="middle">Circuit window</text>
    <text x="360" y="211" text-anchor="middle">horizontal extent + 1</text>
    <text x="592" y="123">vertical extent</text>
    <text x="592" y="145">+ 1</text>
  </g>
</svg>
