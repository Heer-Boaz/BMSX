<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="input-flow-title input-flow-desc">
  <title id="input-flow-title">Input sample latch and independent output request</title>
  <desc id="input-flow-desc">An ARM write and a VBlank-begin edge control one snapshot copy into 41 retained sample words. Cartridge word reads use that bank. STATUS is published after the sample words. Separately, output parameter words feed an immediate request only on the exact APPLY command. The capability mask is sampled input, not output acknowledgement.</desc>
  <defs><marker id="input-flow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker></defs>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="20" y="135" width="175" height="120"/>
    <rect x="280" y="135" width="170" height="120"/>
    <rect x="530" y="100" width="270" height="205"/>
    <rect x="280" y="15" width="170" height="60"/>
    <rect x="20" y="395" width="300" height="95"/>
    <rect x="410" y="395" width="185" height="95"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#input-flow-arrow)">
    <path d="M195 195 H280"/>
    <path d="M450 195 H530"/>
    <path d="M800 195 H895"/>
    <path d="M330 75 V135" stroke-dasharray="6 5"/>
    <path d="M610 60 V90 H410 V135" stroke-dasharray="6 5"/>
    <path d="M665 305 V335" stroke-dasharray="6 5"/>
    <path d="M320 442 H410"/>
    <path d="M260 365 H502 V395" stroke-dasharray="6 5"/>
    <path d="M595 442 H705"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="107" y="186">Input</text><text x="107" y="218">sources</text>
    <text x="365" y="52">CTRL write = 1</text>
    <text x="610" y="48">VBlank begin</text>
    <text x="365" y="176">One-shot arm</text><text x="365" y="208">and edge gate</text><text x="365" y="238" font-size="19">Copy if armed</text>
    <text x="665" y="130">41 retained words</text>
    <text x="665" y="168">Keyboard: 8</text><text x="665" y="199">Pointer: 4</text><text x="665" y="230">Pads: 28</text><text x="665" y="269">Output capability: 1</text>
    <text x="937" y="184" font-size="20">Cartridge</text><text x="937" y="215" font-size="20">word reads</text>
    <text x="665" y="360" font-size="20">Publish STATUS last</text>
    <text x="170" y="428">Output PORT, INTENSITY</text><text x="170" y="460">and DURATION words</text>
    <text x="260" y="354" font-size="20">OUTPUT_CTRL write = 1</text>
    <text x="502" y="428">Immediate</text><text x="502" y="460">APPLY dispatch</text>
    <text x="825" y="429">Vibration request</text><text x="825" y="461">Selected pad</text>
  </g>
</svg>
