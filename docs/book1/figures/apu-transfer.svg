<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="transfer-title transfer-desc">
  <title id="transfer-title">Three sample-RAM transfer paths</title>
  <desc id="transfer-desc">The three rows show different modes using the same private sample RAM. Manual-write CPU stores reach RAM at the port-write edge. DMA-write stores enter the sixteen-word FIFO before one scheduled RAM commit. DMA-read service fills that same FIFO before DMA dequeues its words. All DATA writes update the data latch; CPU DATA reads return only that latch and do not drain the FIFO.</desc>
  <defs><marker id="transfer-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111"/></marker></defs>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="10" y="45" width="250" height="65"/><rect x="730" y="45" width="260" height="65"/>
    <rect x="10" y="180" width="250" height="65"/><rect x="365" y="180" width="240" height="65"/><rect x="730" y="180" width="260" height="65"/>
    <rect x="10" y="320" width="250" height="65"/><rect x="365" y="320" width="240" height="65"/><rect x="730" y="320" width="260" height="65"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#transfer-arrow)">
    <path d="M260 77 H730"/>
    <path d="M260 212 H365"/><path d="M605 212 H730"/>
    <path d="M260 352 H365"/><path d="M605 352 H730"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="135" y="84">CPU DATA write</text><text x="860" y="84">Sample RAM word</text>
    <text x="135" y="219">DMA DATA writes</text><text x="485" y="219">16-word FIFO</text><text x="860" y="219">Sample RAM words</text>
    <text x="135" y="359">Sample RAM words</text><text x="485" y="359">16-word FIFO</text><text x="860" y="359">DMA DATA reads</text>
    <text x="495" y="65" font-size="19">At the CPU port-write edge</text>
    <text x="795" y="162" font-size="19">One scheduled batch commit</text>
    <text x="315" y="310" font-size="18">One scheduled batch fill</text>
    <text x="500" y="420" font-size="19">CPU DATA reads return the latch; they do not dequeue this FIFO.</text>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="22" font-weight="bold">
    <text x="10" y="25">MANUAL_WRITE</text><text x="10" y="160">DMA_WRITE</text><text x="10" y="300">DMA_READ</text>
  </g>
</svg>
