<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

	<head>
		<meta charset="utf-8" />
		@@BMSX_PRODUCT_CONFIGURATION@@
		<title>#title</title>
		<meta name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-status-bar-style" content="black">
		<meta name="mobile-web-app-title" content="#title">
		<link rel="manifest" href="manifest.webmanifest">
		<link rel="apple-touch-icon" href="bmsx_icon.png">
		<link rel="icon" type="image/png" href="bmsx_icon.png">
		<link rel="shortcut icon" type="image/x-icon" href="bmsx_icon.png">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
		<style>
			/*#css*/
		</style>
	</head>

	<body data-default-rom="@@BMSX_DEFAULT_ROM@@" data-system-rom="@@BMSX_SYSTEM_ROM@@">
		<div id="player-surface">
			<img id="msx" class="hidden" src="@@BMSX_LOGO@@" alt="MSX" hidden>
			<div id="hidor"></div>
			<div id="loading" class="coloring">Loading...</div>
			<div id="extra-message" class="coloring" hidden></div>
			<div id="d-pad-controls" aria-hidden="true" hidden>
				<svg id="d-pad-svg" viewBox="0 0 100 100" width="100" height="100">
					<circle id="d-pad-base" cx="50" cy="50" r="50" data-touched="false" />
					<circle id="d-pad-deadzone" cx="50" cy="50" r="9" />
					<circle id="d-pad-tip" cx="50" cy="50" r="18" />
				</svg>
			</div>
			<div id="button-controls" aria-hidden="true" hidden>
				<svg id="action-buttons-svg" viewBox="0 0 180 190" width="180" height="190">
					<circle id="ls_knop" class="action-button auxiliary orange" cx="20" cy="20" r="18" data-touched="false" />
					<text id="ls_knop_text" x="20" y="20" class="action-label auxiliary-label">LS</text>
					<circle id="rs_knop" class="action-button auxiliary purple" cx="64" cy="20" r="18" data-touched="false" />
					<text id="rs_knop_text" x="64" y="20" class="action-label auxiliary-label">RS</text>
					<circle id="y_knop" class="action-button green" cx="104" cy="56" r="24" data-touched="false" />
					<text id="y_knop_text" x="104" y="56" class="action-label">Y</text>
					<circle id="x_knop" class="action-button pink" cx="68" cy="92" r="24" data-touched="false" />
					<text id="x_knop_text" x="68" y="92" class="action-label">X</text>
					<circle id="b_knop" class="action-button red" cx="140" cy="92" r="24" data-touched="false" />
					<text id="b_knop_text" x="140" y="92" class="action-label">B</text>
					<circle id="a_knop" class="action-button blue" cx="104" cy="128" r="24" data-touched="false" />
					<text id="a_knop_text" x="104" y="128" class="action-label">A</text>
					<circle id="select_knop" class="action-button auxiliary yellow" cx="20" cy="144" r="18" data-touched="false" />
					<text id="select_knop_text" x="20" y="144" class="action-label auxiliary-label">SE</text>
					<circle id="start_knop" class="action-button auxiliary light-blue" cx="56" cy="168" r="18" data-touched="false" />
					<text id="start_knop_text" x="56" y="168" class="action-label auxiliary-label">ST</text>
				</svg>
			</div>
			<div id="gameContainer">
				<canvas id="gamescreen" hidden></canvas>
			</div>
		</div>
		<script src="#browserhostjs"></script>
	</body>

</html>
