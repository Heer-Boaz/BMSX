<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

	<head>
		<meta charset="utf-8" />
		@@BMSX_PRODUCT_CONFIGURATION@@
		<title>#title</title>
		<meta name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-status-bar-style" content="black">
		<meta name="mobile-web-app-title" content="#title">
		<link rel="manifest" href="@@BMSX_MANIFEST@@">
		<link rel="apple-touch-icon" href="bmsx_icon.png">
		<link rel="icon" type="image/png" href="bmsx_icon.png">
		<link rel="shortcut icon" type="image/x-icon" href="bmsx_icon.png">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" crossorigin="anonymous">
		<style>
			/*#css*/
		</style>
	</head>

	<body data-default-rom="@@BMSX_DEFAULT_ROM@@" data-system-rom="@@BMSX_SYSTEM_ROM@@">
		<div id="player-surface">
			<img id="msx" class="hidden" src="@@BMSX_LOGO@@" alt="MSX" hidden>
			<div id="hidor"></div>
			<div id="loading" class="coloring">Loading...</div>
			<div id="extra-message" class="coloring" hidden></div>
			<div id="d-pad-controls" class="control-surface" aria-hidden="true" hidden>
				<svg id="d-pad-svg" viewBox="0 0 100 100" width="100" height="100">
					<circle class="control-bezel" cx="50" cy="50" r="51" />
					<circle id="d-pad-base" cx="50" cy="50" r="50" data-touched="false" />
					<circle id="d-pad-deadzone" cx="50" cy="50" r="9" />
					<path class="stick-guides" d="M50 7v4 M89 50h4 M50 89v4 M7 50h4" />
					<circle id="d-pad-tip" cx="50" cy="50" r="18" />
				</svg>
			</div>
			<div id="button-controls" class="control-surface" aria-hidden="true" hidden>
				<svg id="action-buttons-svg" viewBox="0 0 208 208" width="208" height="208">
					<g class="face-control green">
						<circle class="control-bezel" cx="104" cy="40" r="41" />
						<circle id="y_knop" class="action-button" cx="104" cy="40" r="40" data-touched="false" />
						<text id="y_knop_text" x="104" y="39" class="action-label">Y</text>
						<circle class="action-accent" cx="104" cy="65" r="2" />
					</g>
					<g class="face-control pink">
						<circle class="control-bezel" cx="40" cy="104" r="41" />
						<circle id="x_knop" class="action-button" cx="40" cy="104" r="40" data-touched="false" />
						<text id="x_knop_text" x="40" y="103" class="action-label">X</text>
						<circle class="action-accent" cx="40" cy="129" r="2" />
					</g>
					<g class="face-control red">
						<circle class="control-bezel" cx="168" cy="104" r="41" />
						<circle id="b_knop" class="action-button" cx="168" cy="104" r="40" data-touched="false" />
						<text id="b_knop_text" x="168" y="103" class="action-label">B</text>
						<circle class="action-accent" cx="168" cy="129" r="2" />
					</g>
					<g class="face-control blue">
						<circle class="control-bezel" cx="104" cy="168" r="41" />
						<circle id="a_knop" class="action-button" cx="104" cy="168" r="40" data-touched="false" />
						<text id="a_knop_text" x="104" y="167" class="action-label">A</text>
						<circle class="action-accent" cx="104" cy="193" r="2" />
					</g>
				</svg>
			</div>
			<div id="ls-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
				<svg viewBox="0 0 44 44" width="44" height="44">
					<circle class="control-bezel" cx="22" cy="22" r="23" />
					<circle id="ls_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
					<text id="ls_knop_text" x="22" y="22" class="action-label auxiliary-label">LS</text>
				</svg>
			</div>
			<div id="select-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
				<svg viewBox="0 0 44 44" width="44" height="44">
					<circle class="control-bezel" cx="22" cy="22" r="23" />
					<circle id="select_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
					<text id="select_knop_text" x="22" y="22" class="action-label menu-label">SELECT</text>
				</svg>
			</div>
			<div id="start-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
				<svg viewBox="0 0 44 44" width="44" height="44">
					<circle class="control-bezel" cx="22" cy="22" r="23" />
					<circle id="start_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
					<text id="start_knop_text" x="22" y="22" class="action-label menu-label">START</text>
				</svg>
			</div>
			<div id="rs-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
				<svg viewBox="0 0 44 44" width="44" height="44">
					<circle class="control-bezel" cx="22" cy="22" r="23" />
					<circle id="rs_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
					<text id="rs_knop_text" x="22" y="22" class="action-label auxiliary-label">RS</text>
				</svg>
			</div>
			<div id="gameContainer">
				<canvas id="gamescreen" hidden></canvas>
			</div>
		</div>
		<script src="#browserhostjs"></script>
	</body>

</html>
