<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

	<head>
		<meta charset="utf-8" />
		@@BMSX_PRODUCT_CONFIGURATION@@
		<title>#title</title>
		<meta name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-status-bar-style" content="black">
		<meta name="mobile-web-app-title" content="#title">
		<link rel="manifest" href="@@BMSX_MANIFEST@@">
		<link rel="apple-touch-icon" href="bmsx_icon.png">
		<link rel="icon" type="image/png" href="bmsx_icon.png">
		<link rel="shortcut icon" type="image/x-icon" href="bmsx_icon.png">
		<style>
			/*#css*/
		</style>
	</head>

	<body data-default-rom="@@BMSX_DEFAULT_ROM@@" data-system-rom="@@BMSX_SYSTEM_ROM@@">
		<div id="player-surface">
			<img id="msx" class="hidden" src="@@BMSX_LOGO@@" alt="MSX" hidden>
			<div id="hidor"></div>
			<div id="loading" class="coloring">Loading...</div>
			<div id="extra-message" class="coloring" hidden></div>
			<div id="controller-viewport">
				<div id="d-pad-controls" class="control-surface" aria-hidden="true" hidden>
					<svg id="d-pad-svg" viewBox="0 0 100 100" width="100" height="100">
						<g id="d-pad-artwork" transform="translate(50 50) scale(1.35) translate(-50 -50)">
						<path class="control-bezel" d="M41 17H59Q63 17 63 21V37H79Q83 37 83 41V59Q83 63 79 63H63V79Q63 83 59 83H41Q37 83 37 79V63H21Q17 63 17 59V41Q17 37 21 37H37V21Q37 17 41 17Z" />
						<path id="d-pad-cross" class="d-pad-outline" d="M41 17H59Q63 17 63 21V37H79Q83 37 83 41V59Q83 63 79 63H63V79Q63 83 59 83H41Q37 83 37 79V63H21Q17 63 17 59V41Q17 37 21 37H37V21Q37 17 41 17Z" />
						<path id="d-pad-u" class="d-pad-direction" data-touched="false" d="M37 37V21Q37 17 41 17H59Q63 17 63 21V37M45 31L50 26L55 31" />
						<path id="d-pad-d" class="d-pad-direction" data-touched="false" transform="rotate(180 50 50)" d="M37 37V21Q37 17 41 17H59Q63 17 63 21V37M45 31L50 26L55 31" />
						<path id="d-pad-l" class="d-pad-direction" data-touched="false" transform="rotate(270 50 50)" d="M37 37V21Q37 17 41 17H59Q63 17 63 21V37M45 31L50 26L55 31" />
						<path id="d-pad-r" class="d-pad-direction" data-touched="false" transform="rotate(90 50 50)" d="M37 37V21Q37 17 41 17H59Q63 17 63 21V37M45 31L50 26L55 31" />
						</g>
						<g id="left-stick-artwork" transform="translate(50 50) scale(1.11) translate(-50 -50)" visibility="hidden">
							<circle class="control-bezel" cx="50" cy="50" r="42" />
							<circle class="stick-outline" cx="50" cy="50" r="42" />
							<circle id="left-stick-tip" class="stick-outline" cx="50" cy="50" r="18" data-touched="false" />
						</g>
					</svg>
				</div>
				<div id="button-controls" class="control-surface" aria-hidden="true" hidden>
					<svg id="action-buttons-svg" viewBox="0 0 208 208" width="208" height="208">
						<g class="face-control green">
							<circle class="control-bezel" cx="104" cy="40" r="41" />
							<circle id="y_knop" class="action-button" cx="104" cy="40" r="40" data-touched="false" />
							<text id="y_knop_text" x="104" y="39" class="action-label">Y</text>
							<circle class="action-accent" cx="104" cy="65" r="2" />
						</g>
						<g class="face-control pink">
							<circle class="control-bezel" cx="40" cy="104" r="41" />
							<circle id="x_knop" class="action-button" cx="40" cy="104" r="40" data-touched="false" />
							<text id="x_knop_text" x="40" y="103" class="action-label">X</text>
							<circle class="action-accent" cx="40" cy="129" r="2" />
						</g>
						<g class="face-control red">
							<circle class="control-bezel" cx="168" cy="104" r="41" />
							<circle id="b_knop" class="action-button" cx="168" cy="104" r="40" data-touched="false" />
							<text id="b_knop_text" x="168" y="103" class="action-label">B</text>
							<circle class="action-accent" cx="168" cy="129" r="2" />
						</g>
						<g class="face-control blue">
							<circle class="control-bezel" cx="104" cy="168" r="41" />
							<circle id="a_knop" class="action-button" cx="104" cy="168" r="40" data-touched="false" />
							<text id="a_knop_text" x="104" y="167" class="action-label">A</text>
							<circle class="action-accent" cx="104" cy="193" r="2" />
						</g>
					</svg>
				</div>
				<div id="ls-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 44 44" width="44" height="44">
						<circle class="control-bezel" cx="22" cy="22" r="23" />
						<circle id="ls_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
						<text id="ls_knop_text" x="22" y="22" class="action-label auxiliary-label">LS</text>
					</svg>
				</div>
				<div id="select-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 44 44" width="44" height="44">
						<circle class="control-bezel" cx="22" cy="22" r="23" />
						<circle id="select_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
						<text id="select_knop_text" x="22" y="22" class="action-label menu-label">SELECT</text>
					</svg>
				</div>
				<div id="start-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 44 44" width="44" height="44">
						<circle class="control-bezel" cx="22" cy="22" r="23" />
						<circle id="start_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
						<text id="start_knop_text" x="22" y="22" class="action-label menu-label">START</text>
					</svg>
				</div>
				<div id="rs-controls" class="control-surface utility-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 44 44" width="44" height="44">
						<circle class="control-bezel" cx="22" cy="22" r="23" />
						<circle id="rs_knop" class="action-button auxiliary" cx="22" cy="22" r="22" data-touched="false" />
						<text id="rs_knop_text" x="22" y="22" class="action-label auxiliary-label">RS</text>
					</svg>
				</div>
				<div id="lb-controls" class="control-surface shoulder-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 112 56" width="112" height="56">
						<path class="control-bezel" />
						<path id="lb_knop" class="action-button auxiliary" data-touched="false" />
						<text id="lb_knop_text" x="56" y="28" class="action-label shoulder-label">LB</text>
					</svg>
				</div>
				<div id="rb-controls" class="control-surface shoulder-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 112 56" width="112" height="56">
						<path class="control-bezel" />
						<path id="rb_knop" class="action-button auxiliary" data-touched="false" />
						<text id="rb_knop_text" x="56" y="28" class="action-label shoulder-label">RB</text>
					</svg>
				</div>
				<div id="lt-controls" class="control-surface shoulder-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 112 56" width="112" height="56">
						<path class="control-bezel" />
						<path id="lt_knop" class="action-button auxiliary" data-touched="false" />
						<text id="lt_knop_text" x="56" y="28" class="action-label shoulder-label">LT</text>
					</svg>
				</div>
				<div id="rt-controls" class="control-surface shoulder-surface" aria-hidden="true" hidden>
					<svg viewBox="0 0 112 56" width="112" height="56">
						<path class="control-bezel" />
						<path id="rt_knop" class="action-button auxiliary" data-touched="false" />
						<text id="rt_knop_text" x="56" y="28" class="action-label shoulder-label">RT</text>
					</svg>
				</div>
			</div>
			<div id="bmsx-touch-keyboard-surface">
				<section id="bmsx-touch-keyboard" class="bmsx-touch-keyboard" aria-label="On-screen keyboard" hidden>
					@@BMSX_TOUCH_KEYBOARD_PAGES@@
				</section>
			</div>
			<!-- Package-time fragments. The build expands layout data here and removes these templates. -->
			<template data-bmsx-keyboard="page">
				<div class="bmsx-touch-keyboard-page" data-page="@@PAGE@@" style="--page-units:@@UNITS@@;--page-rows:@@ROW_COUNT@@" hidden>
					@@ROWS@@
				</div>
			</template>
			<template data-bmsx-keyboard="row">
				<div class="bmsx-touch-keyboard-row" style="--row-units:@@UNITS@@">
					@@SLOTS@@
				</div>
			</template>
			<template data-bmsx-keyboard="key">
				<div class="bmsx-touch-keyboard-slot" style="--key-start:@@START@@;--key-span:@@SPAN@@">
					<button type="button" tabindex="-1" class="bmsx-touch-key" data-key="@@KEY@@" data-page="@@PAGE@@"
						data-code="@@CODE@@" aria-label="@@DESCRIPTION@@" aria-pressed="false"
						data-selected="false" data-highlighted="false" data-wide-label="@@WIDE@@">@@LABEL@@</button>
				</div>
			</template>
			<template data-bmsx-keyboard="mode">
				<div class="bmsx-touch-keyboard-slot" style="--key-start:@@START@@;--key-span:@@SPAN@@">
					<button type="button" tabindex="-1" class="bmsx-touch-keyboard-command bmsx-touch-keyboard-mode"
						data-keyboard-action="@@ACTION@@" aria-label="Show @@DESCRIPTION@@">@@LABEL@@</button>
				</div>
			</template>
			<template data-bmsx-keyboard="close">
				<div class="bmsx-touch-keyboard-slot" style="--key-start:@@START@@;--key-span:@@SPAN@@">
					<button type="button" tabindex="-1" class="bmsx-touch-keyboard-command bmsx-touch-keyboard-close"
						data-keyboard-action="@@ACTION@@" aria-label="Close on-screen keyboard">
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<rect x="2" y="3" width="20" height="12" rx="2" />
							<path d="M6 7h.01M10 7h.01M14 7h.01M18 7h.01M6 11h.01M9 11h6M18 11h.01M8 19l4 3 4-3" />
						</svg>
					</button>
				</div>
			</template>
			<div id="gameContainer">
				<canvas id="gamescreen" hidden></canvas>
			</div>
		</div>
		@@BMSX_BEFORE_HOST_SCRIPT@@
		<script src="#browserhostjs" crossorigin="anonymous"></script>
	</body>

</html>
